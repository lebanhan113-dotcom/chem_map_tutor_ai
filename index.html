function page(title,lead,inner,ey='EDUPLAN AI 2026'){return `<div class="eyebrow">${ey}</div><h1>${esc(title)}</h1><p class="lead">${esc(lead)}</p>${inner}<p class="footnote">Bản trình diễn chạy trên trình duyệt; dữ liệu chỉ lưu trên thiết bị hiện tại. Không nhập thông tin cá nhân thực của học sinh. Nội dung Hóa học do giáo viên kiểm tra trước khi sử dụng.</p>`}
function card(title,body,extra=''){return `<div class="card"><h2>${title}</h2>${body}${extra}</div>`}
function nav(id){current=id;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.id===id));const obj=GROUPS.flatMap(g=>g.items).find(x=>x[0]===id);$('crumb').textContent=obj?obj[2]:'Tổng quan';let f={home:homePage,chem:chemPage,exam:examPage,stats:statsPage,hsa:hsaPage,eduplan:()=>templatePage('eduplan'),lesson:()=>templatePage('lesson'),worksheet:()=>templatePage('worksheet'),solve:solvePage,studio:studioPage,ink:inkPage,homeroom:homeRoomPage,seats:seatsPage,rank:rankPage,jobs:jobsPage,docs:docsPage,history:historyPage,guide:guidePage,pdfexam:pdfExamPage,convert:convertPage,ocr:ocrPage};$('content').innerHTML=(f[id]||homePage)();window.scrollTo({top:0,behavior:'instant'});if(id==='ink')setTimeout(initCanvas,20)}

function homePage(){let results=data.attempts,avg=results.length?Math.round(results.reduce((s,a)=>s+a.pct,0)/results.length):0;return page('Một nơi cho mọi tác vụ dạy Hóa học','Từ kế hoạch, ngân hàng đề, bài luyện tập đến theo dõi tiến bộ và công tác chủ nhiệm; khởi đầu với các chức năng cốt lõi vận hành ngay trong trình duyệt.',`<div class="hint"><strong>Phiên bản thực tế dùng thử:</strong> những thẻ có nhãn V2 hoặc DEMO chưa có xử lý AI/OCR hoàn chỉnh. Các bài kiểm tra được làm và chấm trên thiết bị hiện tại; để thi trực tuyến nhiều máy cần triển khai máy chủ.</div><div class="grid four"><div class="card stat"><div class="small">Câu hỏi trong ngân hàng</div><div class="n">${data.questions.length}</div><div class="small">Có thể biên tập và trộn đề</div></div><div class="card stat"><div class="small">Lượt làm bài cục bộ</div><div class="n">${results.length}</div><div class="small">Dữ liệu chỉ trên trình duyệt này</div></div><div class="card stat"><div class="small">Điểm trung bình</div><div class="n">${avg}%</div><div class="small">Mẫu thống kê nội bộ</div></div><div class="card stat"><div class="small">Học sinh mã hóa</div><div class="n">${data.students.length}</div><div class="small">Dữ liệu mẫu; không có tên thật</div></div></div><br><div class="grid"><div class="card"><span class="tag">TRỌNG TÂM 01</span><h2 style="margin-top:10px">Khảo thí và phân tích lỗi sai</h2><p>Tạo đề theo lớp/chủ đề, đảo thứ tự câu hỏi, làm bài thử và báo cáo theo mức độ.</p><button class="btn" onclick="nav('exam')">Tạo đề Hóa học →</button></div><div class="card"><span class="tag">TRỌNG TÂM 02</span><h2 style="margin-top:10px">Soạn giảng tự động theo mẫu</h2><p>Tạo bản thảo kế hoạch dạy học, kế hoạch giáo dục và phiếu học tập để giáo viên biên tập.</p><button class="btn teal" onclick="nav('lesson')">Soạn kế hoạch →</button></div><div class="card"><span class="tag">TRỌNG TÂM 03</span><h2 style="margin-top:10px">Tổ chức lớp học</h2><p>Sổ chủ nhiệm mã hóa, sơ đồ chỗ ngồi, chọn ngẫu nhiên và điểm thi đua.</p><button class="btn ghost" onclick="nav('seats')">Xem sơ đồ lớp →</button></div></div><br>${card('Lộ trình xây dựng ứng dụng',`<div class="grid three"><div><span class="tag">Pha 1 • MVP</span><p>Ngân hàng câu hỏi, quiz, thống kê, kế hoạch, phiếu, sổ lớp, bảng vẽ.</p></div><div><span class="tag plan">Pha 2 • AI chuẩn hóa</span><p>Tách PDF/OCR, sinh câu hỏi có xác minh, giải thích lỗi sai, xuất DOCX chuẩn hóa.</p></div><div><span class="tag demo">Pha 3 • Tích hợp và nhân rộng</span><p>Đăng nhập trường học, phân quyền, thi đa thiết bị, báo cáo nhiều lớp.</p></div></div>`)}`)}
const atomMass={H:1.008,He:4.003,Li:6.94,Be:9.012,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,Ne:20.18,Na:22.99,Mg:24.305,Al:26.982,Si:28.085,P:30.974,S:32.06,Cl:35.45,Ar:39.948,K:39.098,Ca:40.078,Cr:51.996,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,Br:79.904,Ag:107.868,I:126.904,Ba:137.327,Pb:207.2};
function chemNormalize(s){return String(s).replace(/[₀-₉]/g,x=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(x)]).replace(/\s/g,'')}
function parseFormula(s){s=chemNormalize(s);let tokens=s.match(/[A-Z][a-z]?|\d+|[()]/g)||[];if(tokens.join('')!==s||!tokens.length)throw Error('Kí hiệu chưa được hỗ trợ; nhập ví dụ Ca(OH)2 hoặc H2SO4.');let i=0;function group(){let counts={};while(i<tokens.length&&tokens[i]!==')'){let c=tokens[i++],next;if(c==='('){next=group();if(tokens[i++]!==')')throw Error('Thiếu dấu đóng ngoặc.')}else if(atomMass[c]!==undefined)next={[c]:1};else throw Error('Nguyên tố '+c+' chưa có trong từ điển hoặc công thức sai.');let factor=1;if(/^\d+$/.test(tokens[i]||''))factor=Number(tokens[i++]);if(factor<=0||factor>10000)throw Error('Chỉ số nguyên tử không hợp lệ.');for(let [k,v] of Object.entries(next))counts[k]=(counts[k]||0)+v*factor;}return counts}let counts=group();if(i!==tokens.length)throw Error('Có dấu ngoặc hoặc phần công thức chưa hợp lệ.');return counts}
function massCalc(){try{let f=$('formula').value,c=parseFormula(f),m=Object.entries(c).reduce((v,[e,n])=>v+atomMass[e]*n,0);$('massResult').innerHTML=`<div class="bigresult">M ≈ ${m.toFixed(3)} g/mol</div><p>${Object.entries(c).map(([e,n])=>esc(e)+': '+n).join(' • ')}</p><small>Nguyên tử khối được làm tròn, phù hợp tính toán học tập; chỉ hỗ trợ các nguyên tố đã khai báo.</small>`;log('Tra khối lượng mol '+f)}catch(e){$('massResult').textContent=e.message}}
function chemPage(){return page('Bộ công cụ Hóa học chính xác','Bảng tính khối lượng mol, số mol và nồng độ cho các phép tính mẫu. Kết quả định hướng giảng dạy, luôn được giáo viên kiểm tra.',`<div class="grid two">${card('Tính khối lượng mol',`<div class="field"><label>Công thức (hỗ trợ ngoặc đơn)</label><input id="formula" value="Fe2(SO4)3" placeholder="H2SO4, Ca(OH)2, C6H12O6"></div><br><button class="btn teal" onclick="massCalc()">Tính M</button><div id="massResult" class="muted" style="margin-top:16px">Ví dụ: Fe₂(SO₄)₃</div>`)}${card('Tính n, m, Cₘ và pha loãng',`<div class="field"><label>Kiểu tính</label><select id="ctype"><option value="n">n = m/M</option><option value="m">m = n×M</option><option value="cm">Cₘ = n/V</option><option value="dil">C₁V₁ = C₂V₂</option></select></div><br><div class="row"><div class="field"><label>Số A (m, n hoặc C₁)</label><input id="numA" type="number" step="any" value="9.8"></div><div class="field"><label>Số B (M, V hoặc V₁)</label><input id="numB" type="number" step="any" value="98"></div></div><br><div class="field"><label>Với pha loãng, nhập C₂ (số C)</label><input id="numC" type="number" step="any" value="0.5"></div><br><button class="btn" onclick="basicCalc()">Tính kết quả</button><div id="basicResult" class="bigresult"></div><div class="note">Quy ước: V trong Cₘ phải tính bằng lít; V₁ và V₂ có cùng đơn vị; các nồng độ dùng cùng hệ đơn vị.</div>`)} </div><br>${card('Phản ứng minh họa đã được cân bằng',`<div class="samples"><button class="sample" onclick="flash('Phản ứng oxi hóa: 4Fe + 3O₂ → 2Fe₂O₃')">4Fe + 3O₂ → 2Fe₂O₃<br><small>Oxi hóa kim loại (lớp 10)</small></button><button class="sample" onclick="flash('Phản ứng: N₂ + 3H₂ ⇌ 2NH₃')">N₂ + 3H₂ ⇌ 2NH₃<br><small>Cân bằng hóa học (lớp 11)</small></button><button class="sample" onclick="flash('Phản ứng: CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O')">CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O<br><small>Ester hóa (lớp 12)</small></button><button class="sample" onclick="flash('Cathode: Cu²⁺ + 2e → Cu')">Cu²⁺ + 2e → Cu<br><small>Điện phân (lớp 12)</small></button></div><p class="compact muted">Bản demo chưa có bộ cân bằng phản ứng tùy ý và chưa thể kiểm tra điều kiện phản ứng; tính năng ChemGuard có trong thiết kế nâng cấp.</p>`)}`)}
function basicCalc(){let a=Number($('numA').value),b=Number($('numB').value),c=Number($('numC').value),ty=$('ctype').value,ans,label;if(!Number.isFinite(a)||!Number.isFinite(b)||!Number.isFinite(c)){flash('Vui lòng nhập số hợp lệ');return}if(ty==='n'){ans=a/b;label='n'}else if(ty==='m'){ans=a*b;label='m'}else if(ty==='cm'){ans=a/b;label='Cₘ'}else{ans=a*b/c;label='V₂'}if(!Number.isFinite(ans)||ans<0||(["n","cm"].includes(ty)&&b<=0)||(ty==='dil'&&c<=0)){flash('Kiểm tra mẫu số và dữ liệu không âm');return}$('basicResult').textContent=label+' = '+Number(ans.toFixed(5)).toLocaleString('vi-VN');log('Thực hiện phép tính Hóa học')}
function qOpts(){return data.questions.filter(q=>q.g===grade)}
function examPage(){let list=qOpts();return page('Ngân hàng câu hỏi & Trộn đề','Chọn ngân hàng theo lớp, tạo đề luyện tập và ghi nhận điểm trên thiết bị. Có thể thêm câu hỏi của giáo viên và xuất bản in.',`<div class="grid two">${card('Tạo đề nhanh',`<div class="row"><div class="field"><label>Chủ đề</label><select id="filterTopic"><option value="all">Tất cả chủ đề</option>${topics[grade].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Số câu</label><input type="number" min="1" max="40" value="5" id="questionCount"></div></div><br><div class="row"><button class="btn teal" onclick="generateExam()">Trộn & làm thử</button><button class="btn ghost" onclick="printExam()">In đề hiện có</button></div><p class="compact muted">Mặc định có ${list.length} câu hỏi mẫu Hóa ${grade}; điểm và câu sai được lưu cho thống kê. Bản mẫu chỉ trộn thứ tự câu, chưa trộn vị trí đáp án.</p>`)}${card('Thêm câu hỏi mới',`<div class="stack"><div class="row"><div class="field"><label>Chủ đề</label><select id="newTopic">${topics[grade].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Mức độ</label><select id="newLv"><option>Nhận biết</option><option>Thông hiểu</option><option>Vận dụng</option><option>Vận dụng cao</option></select></div></div><div class="field"><label>Nội dung câu hỏi</label><textarea id="newStem" rows="2" placeholder="Nhập câu hỏi có đầy đủ dữ kiện..."></textarea></div><div class="field"><label>4 phương án (mỗi dòng một phương án)</label><textarea id="newOps" rows="3" placeholder="A ...&#10;B ...&#10;C ...&#10;D ..."></textarea></div><div class="row"><div class="field"><label>Đáp án đúng</label><select id="newAns"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Giải thích</label><input id="newExp" placeholder="Lời giải ngắn"></div></div><button class="btn" onclick="addQuestion()">Lưu câu hỏi</button></div>`)}</div><br><div id="examZone">${examSet.length?examHTML():'<div class="card empty">Chưa tạo đề. Chọn số câu và bấm “Trộn & làm thử”.</div>'}</div>`)}
function addQuestion(){let stem=$('newStem').value.trim(),ops=$('newOps').value.split('\n').map(s=>s.trim().replace(/^[A-Da-d][.)]\s*/,''));if(!stem||ops.length!==4||ops.some(x=>!x)){flash('Cần nội dung và chính xác 4 phương án');return}data.questions.push({id:Date.now(),g:grade,topic:$('newTopic').value,lv:$('newLv').value,stem,ops,ans:Number($('newAns').value),exp:$('newExp').value.trim()||'Giáo viên cần bổ sung lời giải.'});save();log('Thêm câu hỏi Hóa '+grade);nav('exam');flash('Đã thêm câu hỏi')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateExam(){let t=$('filterTopic').value,num=Math.max(1,Math.min(40,Number($('questionCount').value)||5));let pool=qOpts().filter(q=>t==='all'||q.topic===t);if(!pool.length)return flash('Chưa có câu hỏi cho chủ đề này');examSet=shuffle(pool).slice(0,num);$('examZone').innerHTML=examHTML();log(`Tạo đề ${examSet.length} câu Hóa ${grade}`)}
function examHTML(){return `<div class="card"><div class="row between"><div><h2>Đề luyện tập Hóa ${grade}</h2><p>${examSet.length} câu • Lượt làm cục bộ • Không giám sát thi</p></div><div style="min-width:210px"><label class="compact">Mã người làm (ví dụ: HS01)</label><input id="candidate" placeholder="HS01 (không dùng tên thật)" maxlength="32"></div></div><div id="qArea">${examSet.map((q,i)=>`<div class="question"><div class="meta">Câu ${i+1} · ${esc(q.topic)} · ${esc(q.lv)}</div><strong>${esc(q.stem)}</strong>${q.ops.map((o,j)=>`<label class="option"><input type="radio" name="ans${i}" value="${j}"> ${'ABCD'[j]}. ${esc(o)}</label>`).join('')}</div>`).join('')}</div><div class="row"><button class="btn teal" onclick="submitExam()">Nộp bài & Chấm điểm</button><button class="btn ghost" onclick="printExam()">In đề</button></div><div id="examFeedback"></div></div>`}
function submitExam(){if(!examSet.length)return;let candidate=$('candidate')?.value.trim().toUpperCase()||'KHACH',correct=0,breakdown=[],detail=[];examSet.forEach((q,i)=>{let v=document.querySelector(`input[name="ans${i}"]:checked`),a=v?Number(v.value):-1,ok=a===q.ans;if(ok)correct++;detail.push({id:q.id,topic:q.topic,lv:q.lv,ok});breakdown.push(`<div class="question"><strong>Câu ${i+1}: ${ok?'✅ Đúng':'❌ Chưa đúng'} (${esc(q.lv)})</strong><div>Đáp án đúng: <b>${'ABCD'[q.ans]}</b>. ${esc(q.ops[q.ans])}</div><p class="compact">${esc(q.exp)}</p></div>`)});let pct=Math.round(100*correct/examSet.length);data.attempts.unshift({id:Date.now(),time:new Date().toLocaleString('vi-VN'),candidate,g:grade,correct,total:examSet.length,pct,detail});save();log('Chấm bài '+candidate+' • '+pct+'%');$('examFeedback').innerHTML=`<hr class="sep"><h2>Kết quả: ${correct}/${examSet.length} câu (${pct}%)</h2>${breakdown.join('')}<div class="hint">Đã lưu kết quả trên trình duyệt hiện tại. Không có dữ liệu truyền lên máy chủ.</div>`;flash('Đã ghi nhận bài làm')}
function printExam(){if(!examSet.length)return flash('Bạn cần tạo đề trước');let html=`<!doctype html><html lang="vi"><meta charset="utf-8"><title>Đề kiểm tra Hóa ${grade}</title><style>body{font:14pt 'Times New Roman';margin:24mm;line-height:1.45}h1{text-align:center;font-size:17pt}.q{break-inside:avoid;margin:16px 0}.opt{padding-left:18px}</style><h1>ĐỀ LUYỆN TẬP HÓA HỌC ${grade}</h1><p>Họ tên / Mã: .................................................. Lớp: ....................</p>${examSet.map((q,i)=>`<div class="q"><b>Câu ${i+1}.</b> ${esc(q.stem)}${q.ops.map((o,j)=>`<div class="opt">${'ABCD'[j]}. ${esc(o)}</div>`).join('')}</div>`).join('')}</html>`;let w=window.open('','_blank');if(!w){flash('Cho phép cửa sổ bật lên để in');return}w.document.write(html);w.document.close();w.focus();w.print();log('Xuất bản in đề Hóa '+grade)}
function statsPage(){let a=data.attempts,avg=a.length?Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length):0,dd={};a.forEach(x=>x.detail.forEach(d=>{let k=d.topic;dd[k]||={right:0,wrong:0};dd[k][d.ok?'right':'wrong']++}));let rows=Object.entries(dd).sort((a,b)=>b[1].wrong-a[1].wrong);return page('Dashboard thống kê kết quả','Phân tích tỷ lệ đúng, mức độ khó và lỗi sai theo chủ đề dựa trên các lượt làm bài cục bộ. Kết quả chưa phải thống kê toàn trường.',`<div class="grid four"><div class="card stat"><div class="small">Bài đã nộp</div><div class="n">${a.length}</div></div><div class="card stat"><div class="small">Điểm trung bình</div><div class="n">${avg}%</div></div><div class="card stat"><div class="small">Người làm (mã)</div><div class="n">${new Set(a.map(x=>x.candidate)).size}</div></div><div class="card stat"><div class="small">Số chủ đề có bài</div><div class="n">${rows.length}</div></div></div><br><div class="grid two">${card('Tỷ lệ trả lời sai theo chủ đề',rows.length?`<div class="charts">${rows.map(([k,v])=>{let p=Math.round(100*v.wrong/(v.right+v.wrong));return `<div class="chartrow"><span class="compact">${esc(k)}</span><div class="barbg"><div class="bar" style="width:${p}%"></div></div><b>${p}%</b></div>`}).join('')}</div><p class="compact muted">Thanh dài: tỉ lệ câu làm sai lớn hơn, cần ưu tiên ôn tập.</p>`:'<div class="empty">Chưa có dữ liệu. Hãy làm thử một đề.</div>')}${card('Các lượt làm bài gần đây',a.length?`<div class="scroll"><table class="simpleTable"><tr><th>Mã</th><th>Khối</th><th>Điểm</th><th>Ngày</th></tr>${a.slice(0,12).map(x=>`<tr><td>${esc(x.candidate)}</td><td>${x.g}</td><td><b>${x.pct}%</b></td><td>${esc(x.time)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa có lượt làm bài.</div>')}</div><br><div class="hint warn">Độ tin cậy thống kê phụ thuộc số lượt làm và chất lượng câu hỏi. Chưa hỗ trợ phân tích độ khó IRT hoặc đối sánh tương đương giữa các đề; không sử dụng điểm mẫu làm căn cứ đánh giá chính thức.</div>`)}
function hsaPage(){return page('Luyện tư duy HSA & TSA','Kho luyện tập định hướng tư duy định lượng, khoa học và đọc dữ liệu gắn với Hóa học; không sao chép đề có bản quyền và không giả lập điểm chuẩn kỳ thi chính thức.',`${card('Thiết kế mô-đun luyện tập',`<div class="grid two"><div><h3>HSA — ĐHQG Hà Nội</h3><p>Nhánh luyện vận dụng khoa học và tư duy số liệu. Thiết kế ngân hàng riêng theo dạng thức công bố năm 2026.</p><a href="https://www.hsa.edu.vn/huong-dan/dang-thuc-bai-thi" target="_blank" rel="noopener">Thông tin cấu trúc chính thức ↗</a></div><div><h3>TSA — ĐH Bách khoa Hà Nội</h3><p>Chủ điểm: đọc hiểu biểu đồ, suy luận thí nghiệm, phương pháp phân tích dữ liệu định lượng.</p><a href="https://www.hust.edu.vn/vi/news/hoat-dong-chung/dot-thi-dau-tien-ky-thi-danh-gia-tu-duy-2026-655780.html" target="_blank" rel="noopener">Thông tin kỳ thi chính thức ↗</a></div></div><hr class="sep"><p class="muted">Bản mẫu chưa có ngân hàng câu hỏi HSA/TSA chuẩn hóa độc lập; sử dụng ngân hàng Hóa học 10–12 để luyện kiến thức nền.</p><button class="btn" onclick="nav('exam')">Luyện câu hỏi nền tảng</button>`)}`)}
function templatePage(mode){let names={eduplan:'Kế hoạch giáo dục',lesson:'Kế hoạch dạy học',worksheet:'Phiếu học tập'},desc={eduplan:'Tạo khung kế hoạch giáo dục môn Hóa học theo khối, mục tiêu và tiến độ năm học; giáo viên bổ sung phân phối chương trình của đơn vị.',lesson:'Soạn khung kế hoạch một bài dạy với mục tiêu năng lực, chuỗi hoạt động và kiểm tra đánh giá.',worksheet:'Soạn phiếu học tập có nhiệm vụ, dữ liệu mẫu, câu hỏi phân hóa và chỗ trả lời.'};return page(names[mode],desc[mode],`<div class="grid two">${card('Tùy chọn học liệu',`<div class="stack"><div class="field"><label>Bài / Chủ đề</label><select id="tTopic">${topics[grade].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Số tiết / Thời lượng</label><input id="tPeriod" type="number" min="1" max="10" value="2"></div><div class="field"><label>Trọng tâm</label><select id="tFocus"><option>Phát triển năng lực</option><option>Thí nghiệm và STEM</option><option>Bài tập vận dụng thực tế</option></select></div></div><div class="field"><label>Điều chỉnh theo tình hình lớp</label><textarea id="tNote" placeholder="VD: Lớp có nhiều học sinh cần củng cố phương trình phản ứng..."></textarea></div><button class="btn teal" onclick="makeTemplate('${mode}')">Tạo bản thảo</button></div>`)}${card('Quy trình kiểm soát chất lượng',`<div class="hint">1. Xác định yêu cầu cần đạt → 2. Tạo khung → 3. Thẩm định kiến thức Hóa học → 4. Cập nhật điều kiện dạy học → 5. Lưu bản cuối.</div><p>Chương trình cần bám CTGDPT 2018 và kế hoạch giáo dục của nhà trường. Đây là trình tạo <b>khung biểu mẫu dựa trên mẫu nội bộ</b>, chưa phải hệ thống sinh văn bản bằng mô hình AI.</p><p class="compact muted">Các mục ghi mẫu được thay bằng nội dung do giáo viên biên soạn trước khi ban hành.</p>`)}</div><br>${card('Bản thảo có thể biên tập',`<textarea id="generated" style="min-height:370px;font:13px 'Times New Roman',serif" placeholder="Bấm 'Tạo bản thảo'..."></textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="storeTemplate('${mode}')">Lưu lịch sử</button><button class="btn ghost" onclick="downloadDraft('${mode}')">Tải văn bản .txt</button><button class="btn ghost" onclick="printDraft()">In / lưu PDF</button></div>`)}`)}
function makeTemplate(mode){let t=$('tTopic').value,n=$('tPeriod').value,focus=$('tFocus').value,note=$('tNote').value.trim(),txt;if(mode==='eduplan')txt=`KẾ HOẠCH GIÁO DỤC MÔN HÓA HỌC ${grade}\nNăm học: ....................................\nGiáo viên: Lê Bá Nhẫn – Trường THPT Hòn Đất\n\n1. CĂN CỨ XÂY DỰNG\n- Chương trình Giáo dục phổ thông 2018 môn Hóa học và kế hoạch giáo dục nhà trường.\n- Điều kiện cơ sở vật chất, thiết bị và đặc điểm người học.\n\n2. CHỦ ĐỀ ĐƯỢC LỰA CHỌN\n- Chủ đề: ${t}\n- Dự kiến: ${n} tiết (cần đối chiếu phân phối chương trình chính thức).\n- Định hướng: ${focus}.\n\n3. MỤC TIÊU DỰ KIẾN\n- Kiến thức: mô tả, giải thích và vận dụng kiến thức cốt lõi của chủ đề.\n- Năng lực: nhận thức hóa học, tìm hiểu thế giới tự nhiên dưới góc độ hóa học, vận dụng kiến thức đã học.\n- Phẩm chất: trung thực, trách nhiệm, chăm chỉ và ý thức an toàn hóa học.\n\n4. TIẾN ĐỘ - THIẾT BỊ - ĐÁNH GIÁ\nTiết 1: Hình thành vấn đề, kiến tạo kiến thức, đánh giá thường xuyên.\nTiết 2: Thực hành/vận dụng, giải quyết tình huống thực tế.\nThiết bị và học liệu: bổ sung theo điều kiện thực tế.\nMinh chứng: phiếu hoạt động, câu hỏi, sản phẩm học tập.\n\n5. ĐIỀU CHỈNH THỰC TẾ\n${note||'Giáo viên bổ sung đặc điểm lớp, thời gian, thiết bị và học liệu cụ thể.'}\n\n[GIÁO VIÊN KIỂM TRA, ĐỐI CHIẾU VỚI KẾ HOẠCH CỦA ĐƠN VỊ TRƯỚC KHI SỬ DỤNG]`;else if(mode==='lesson')txt=`KẾ HOẠCH BÀI DẠY - HÓA HỌC ${grade}\nChủ đề: ${t}\nThời lượng: ${n} tiết\nĐịnh hướng: ${focus}\n\nI. MỤC TIÊU\n1. Kiến thức: xác định chính xác yêu cầu cần đạt theo chương trình và SGK được sử dụng.\n2. Năng lực đặc thù: nhận thức hóa học; tìm hiểu thế giới tự nhiên dưới góc độ hóa học; vận dụng kiến thức, kĩ năng.\n3. Năng lực chung: tự chủ và tự học, giải quyết vấn đề, giao tiếp và hợp tác.\n4. Phẩm chất: trách nhiệm, chăm chỉ, trung thực, đảm bảo an toàn thí nghiệm.\n\nII. THIẾT BỊ DẠY HỌC VÀ HỌC LIỆU\n- Phần mềm/phiếu học tập; thiết bị thí nghiệm được nhà trường cho phép.\n- Không đề xuất thí nghiệm nguy hiểm hoặc chưa được thẩm định an toàn.\n\nIII. TIẾN TRÌNH DẠY HỌC\nA. Khởi động (tình huống thực tiễn)\nMục tiêu: nêu được vấn đề cần giải quyết.\nTổ chức: câu hỏi gợi mở, dự đoán, thu thập câu trả lời ban đầu.\nB. Hình thành kiến thức\nHọc sinh quan sát tư liệu, phân tích dữ liệu và rút ra kết luận.\nC. Luyện tập (phân hóa)\n- Mức 1: hiểu khái niệm, biểu diễn bằng ký hiệu/công thức đúng.\n- Mức 2: vận dụng bài toán hoặc tình huống thực tiễn.\nD. Vận dụng\nGiải thích hiện tượng thực tế gắn với ${t}.\nE. Đánh giá\nDùng câu hỏi, rubric và phản hồi cá nhân hóa; giáo viên duyệt đáp án.\n\nIV. RÚT KINH NGHIỆM\n${note||'Điền nhận xét và phương án điều chỉnh sau giờ dạy.'}\n\n[ĐÂY LÀ KHUNG BẢN THẢO, CHƯA PHẢI GIÁO ÁN ĐÃ THẨM ĐỊNH]`;else txt=`PHIẾU HỌC TẬP - HÓA HỌC ${grade}\nChủ đề: ${t} | Thời lượng: ${n} tiết\nHọ tên / Mã: .................. Lớp: ..........\n\nNHIỆM VỤ 1 - KHỞI ĐỘNG\nNêu 01 hiện tượng gắn với ${t} và giả thuyết giải thích.\nTrả lời: ..................................................................\n\nNHIỆM VỤ 2 - KHÁM PHÁ / PHÂN TÍCH\nGiáo viên cung cấp bảng dữ liệu hoặc mô tả thí nghiệm đã được kiểm tra.\nCâu 1. Xác định đại lượng, hiện tượng và điều kiện quan sát.\nCâu 2. Viết biểu thức hoặc phương trình hóa học (nếu có).\nTrả lời: ..................................................................\n\nNHIỆM VỤ 3 - LUYỆN TẬP\nBài thông hiểu: rút ra quy luật hoặc giải thích hiện tượng.\nBài vận dụng: xử lí số liệu gắn với bối cảnh thực tiễn.\n\nNHIỆM VỤ 4 - TỰ ĐÁNH GIÁ\n□ Hiểu kiến thức nền   □ Viết công thức đúng   □ Biết đối chiếu kết quả\nĐiểm còn khó: ........................................................\n\nGHI CHÚ CỦA GIÁO VIÊN\n${note||'Bổ sung câu hỏi định lượng chính xác và đáp án tương ứng trước khi phát.'}`;$('generated').value=txt;previewText=txt;flash('Đã tạo khung văn bản; cần giáo viên biên tập')}
function storeTemplate(mode){let t=$('generated')?.value.trim();if(!t)return flash('Chưa có nội dung cần lưu');data.templates.unshift({mode,grade,time:new Date().toLocaleString('vi-VN'),text:t});data.templates=data.templates.slice(0,40);save();log('Lưu '+mode+' Hóa '+grade);flash('Đã lưu bản thảo trong thiết bị')}
function downloadFile(name,content,mime='text/plain;charset=utf-8'){let blob=new Blob([content],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function downloadDraft(mode){let t=$('generated')?.value.trim();if(!t)return flash('Chưa có nội dung');downloadFile(`EduPlan_${mode}_Hoa${grade}.txt`,t);log('Xuất bản thảo '+mode)}
function printDraft(){let t=$('generated')?.value.trim();if(!t)return flash('Chưa có nội dung');let w=window.open('','_blank');if(!w)return flash('Hãy cho phép cửa sổ bật lên');w.document.write(`<meta charset="utf-8"><title>EduPlan AI</title><pre style="font:14pt/1.55 'Times New Roman';white-space:pre-wrap;padding:25mm">${esc(t)}</pre>`);w.document.close();w.focus();w.print()}
function solvePage(){let ex=[['Mol dung dịch','Hòa tan 9,8 g H₂SO₄ vào nước để thu được 0,50 L dung dịch. Tính nồng độ mol.','M(H₂SO₄)=98 g/mol; n=9,8/98=0,10 mol; Cₘ=0,10/0,50=0,20 mol/L.'],['Đốt cháy methane','Đốt cháy hoàn toàn 0,20 mol CH₄. Tính số mol O₂ tối thiểu theo phương trình phản ứng.','CH₄+2O₂→CO₂+2H₂O; n(O₂)=2×0,20=0,40 mol.'],['Thế điện cực','Trong pin Zn–Cu, xác định quá trình oxi hóa tại anode.','Tại anode: Zn→Zn²⁺+2e; Zn đóng vai trò chất khử.']];return page('Giải bài tập có đối chiếu','Cơ chế demo sử dụng bài mẫu đã kiểm tra, không giải tự do bằng mô hình AI và không giả vờ có khả năng chấm toàn bộ bài Hóa học.',`${card('Chọn bài toán mẫu',`<div class="samples">${ex.map((x,i)=>`<button class="sample" onclick="showSolution(${i})"><b>${esc(x[0])}</b><br><span class="muted">${esc(x[1])}</span></button>`).join('')}</div><div id="solution" class="hint" style="margin-top:20px">Chọn một bài toán để xem lời giải theo bước.</div>`)}<script type="application/json" id="soldata">${JSON.stringify(ex)}<\/script>`)}
function showSolution(i){let ex=JSON.parse($('soldata').textContent)[i];$('solution').innerHTML=`<h3>${esc(ex[0])}</h3><p>${esc(ex[1])}</p><b>Lời giải:</b><p>${esc(ex[2])}</p>`;log('Xem lời giải bài mẫu')}
function studioPage(){return page('AI Studio & Sáng tạo học liệu','Bộ tạo câu lệnh chuyên Hóa học để dùng với hệ thống AI do giáo viên chủ động kết nối. Bản demo không gửi dữ liệu tới dịch vụ AI.',`${card('Cấu hình prompt',`<div class="row"><div class="field"><label>Sản phẩm mong muốn</label><select id="promptKind"><option value="infographic">Infographic khoa học 16:9</option><option value="video">Kịch bản video Hóa học 60 giây</option><option value="question">Bộ câu hỏi ba phần theo cấu trúc kiểm tra</option><option value="feedback">Chẩn đoán lỗi sai và phản hồi</option></select></div><div class="field"><label>Chủ đề</label><select id="promptTopic">${topics[grade].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><br><div class="field"><label>Yêu cầu bổ sung</label><textarea id="promptMore" placeholder="Thí dụ: phù hợp lớp có học sinh cần hỗ trợ, không minh họa thí nghiệm nguy hiểm"></textarea></div><br><button class="btn teal" onclick="makePrompt()">Tạo prompt chuyên Hóa</button><br><br><textarea id="promptOut" style="min-height:210px" placeholder="Prompt hiển thị ở đây..."></textarea><br><br><button class="btn ghost" onclick="copyText('promptOut')">Sao chép câu lệnh</button><div class="hint warn" style="margin-top:17px">Phải thẩm định công thức hóa học, hóa trị, điện tích, phương trình, chỉ số trên/dưới và an toàn thí nghiệm. Không nhập thông tin học sinh định danh.</div>`)}`)}
function makePrompt(){let kind=$('promptKind').value,subject=$('promptTopic').value,more=$('promptMore').value.trim();let msg=`Bạn là chuyên gia Hóa học THPT và thiết kế học liệu theo CTGDPT 2018. Hãy xây dựng ${({'infographic':'một infographic 16:9 súc tích, dễ đọc','video':'kịch bản video giáo dục 60 giây gồm 6 cảnh, thời lượng và lời thoại','question':'bộ 8 câu hỏi gồm trắc nghiệm bốn lựa chọn, đúng/sai và trả lời ngắn với đáp án','feedback':'bảng chẩn đoán những lỗi sai thường gặp, nguyên nhân và lộ trình sửa lỗi'})[kind]} cho Hóa học ${grade}, chủ đề "${subject}". Yêu cầu: chính xác khoa học, phân biệt mức độ nhận biết/thông hiểu/vận dụng/vận dụng cao, có minh chứng ứng dụng thực tiễn; viết đúng chỉ số dưới (H₂SO₄), chỉ số trên (Fe³⁺); không suy đoán điều kiện phản ứng; ghi chú an toàn; xuất kết quả có thể kiểm định bởi giáo viên. ${more?'Điều kiện bổ sung: '+more:''} CUỐI CÙNG: tự rà soát 5 lỗi nguy cơ (sai công thức, sai cân bằng, sai đơn vị, sai đáp án, ví dụ nguy hiểm), đánh dấu nội dung cần GV phê duyệt.`;$('promptOut').value=msg;log('Tạo prompt Hóa '+grade)}
function copyText(id){let t=$(id).value||$(id).innerText;if(!t)return flash('Chưa có nội dung');navigator.clipboard?.writeText(t).then(()=>flash('Đã sao chép'),()=>flash('Không sao chép tự động được; hãy chọn và Ctrl+C'))||flash('Hãy chọn văn bản và Ctrl+C')}
function pdfExamPage(){return page('Đề online từ file PDF của giáo viên','Luồng xử lý dự kiến: nhận PDF → trích xuất văn bản/OCR → rà soát công thức → tách câu và đáp án → giáo viên duyệt → phát hành đề.',`${card('Trình nhập nội dung bản thử nghiệm',`<div class="hint warn"><b>Chưa hỗ trợ trích xuất PDF tự động khi chạy offline.</b> Không có thư viện PDF/OCR hoặc máy chủ trong bản này. Bạn có thể dán văn bản được trích xuất từ PDF vào ô dưới để thử quy trình kiểm tra đầu vào; không tự động suy diễn đáp án.</div><div class="field"><label>Nội dung văn bản đã trích xuất từ PDF</label><textarea id="pdfText" rows="8" placeholder="Ví dụ: Câu 1. ...\nA. ...\nB. ...\nC. ...\nD. ..."></textarea></div><br><button class="btn" onclick="inspectPdfText()">Phân tích sơ bộ văn bản</button><div id="pdfInspect"></div>`)}`)}
function inspectPdfText(){let x=$('pdfText').value.trim();if(!x)return flash('Cần nhập văn bản');let n=(x.match(/(?:^|\n)\s*(?:Câu|Cau)\s*\d+[.:]/gim)||[]).length,opts=(x.match(/(?:^|\n)\s*[A-D][.):]/gim)||[]).length;$('pdfInspect').innerHTML=`<div class="hint" style="margin-top:14px">Phát hiện khoảng <b>${n}</b> đầu câu hỏi và <b>${opts}</b> dòng đáp án A–D. Chưa thể kết luận về đáp án đúng hoặc chất lượng OCR. Cần giáo viên duyệt từng câu.</div>`;log('Kiểm tra văn bản từ PDF')}
function convertPage(){return page('Chuyển PDF sang Word','Module cần dịch vụ trích xuất giữ bố cục, OCR công thức, sinh DOCX và xác nhận chất lượng.',`${card('Luồng nâng cấp V2',`<div class="grid four"><div class="hint">1. PDF nguyên bản</div><div class="hint">2. Nhận dạng văn bản, bảng & hình</div><div class="hint">3. Kiểm tra chỉ số trên/dưới</div><div class="hint">4. Xuất DOCX + so sánh</div></div><p>Hiện tại không cung cấp nút chuyển đổi giả lập. Giải pháp sản xuất nên dùng công cụ PDF parser, OCR toán/Hóa và bộ dựng OOXML để giữ công thức có thể chỉnh sửa.</p><button class="btn ghost" onclick="nav('pdfexam')">Dùng thử nhập văn bản trích xuất</button>`)}`)}
function ocrPage(){return page('Math OCR & LaTeX (Word)','Nhận dạng công thức Toán–Hóa và chuyển thành biểu thức chỉnh sửa được trong Word đòi hỏi pipeline OCR chuyên dụng và kiểm thử hóa học.',`${card('Yêu cầu kĩ thuật',`<p>Đầu vào: ảnh hoặc vùng PDF. Đầu ra: văn bản thường + LaTeX/OMML với đúng chỉ số trên/dưới, ký hiệu điện tích, mũi tên phản ứng, hệ số, đơn vị.</p><p>Ví dụ chuẩn: Fe³⁺ + 3OH⁻ → Fe(OH)₃↓; Cₘ = n/V; E°cell = E°cathode − E°anode.</p><div class="hint warn">Bản HTML chưa tích hợp engine OCR nên không có khả năng nhận dạng ảnh. Không dùng biểu thức OCR chưa kiểm tra để chấm thi tự động.</div>`)}`)}
let ctx=null,painting=false,last=null;function inkPage(){return page('EduPlan AI Ink — Bảng viết tương tác','Vẽ sơ đồ, ghi chú, giải bài trên bảng trắng; tải ảnh PNG để đưa vào slide hoặc phiếu học tập.',`<div class="toolbar row"><label class="compact">Màu mực: <input id="penColor" type="color" value="#17488c" style="width:48px;padding:2px;height:37px;vertical-align:middle"></label><label class="compact">Độ rộng: <input id="penSize" type="range" min="1" max="12" value="3" style="width:110px;vertical-align:middle"></label><button class="btn ghost mini" onclick="clearInk()">Xóa bảng</button><button class="btn teal mini" onclick="saveInk()">Lưu hình PNG</button></div><canvas class="board" id="canvas" aria-label="Bảng vẽ Hóa học"></canvas><div class="note">Bảng vẽ hỗ trợ chuột/bút cảm ứng; chữ và cấu trúc phân tử chưa được nhận dạng tự động.</div>`)}
function initCanvas(){let c=$('canvas');if(!c)return;let r=c.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(400*devicePixelRatio);ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,400);c.onpointerdown=e=>{painting=true;last={x:e.offsetX,y:e.offsetY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!painting)return;ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=Number($('penSize').value);ctx.strokeStyle=$('penColor').value;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();last={x:e.offsetX,y:e.offsetY}};c.onpointerup=()=>{painting=false;last=null};c.onpointercancel=()=>{painting=false;last=null}}
function clearInk(){if(!ctx)return;let c=$('canvas');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);flash('Đã xóa bảng')}function saveInk(){let c=$('canvas');if(!c)return;c.toBlob(blob=>{if(!blob)return;let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='EduPlan_AI_Ink.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log('Xuất ảnh từ bảng Ink')})}
function homeRoomPage(){return page('Sổ chủ nhiệm & Quản lý lớp','Quản lý học sinh theo mã định danh giả lập, điểm hoạt động và ghi chú. Không nhập tên thật, số điện thoại, địa chỉ hoặc dữ liệu nhạy cảm vào bản demo.',`${card('Thêm mã học sinh',`<div class="row"><div class="field"><label>Mã học sinh</label><input id="sid" placeholder="HS25"></div><div class="field"><label>Nhãn hiển thị (không định danh)</label><input id="sname" placeholder="Nhóm A - 01"></div><button class="btn teal" onclick="addStudent()">Thêm</button></div><div class="hint warn" style="margin-top:15px">Dữ liệu mẫu không phải hồ sơ nhà trường. Nếu triển khai thật phải bổ sung quyền truy cập theo vai trò, hồ sơ pháp lý bảo vệ dữ liệu và quy trình xử lý yêu cầu của học sinh/phụ huynh.</div>`)}<br>${card('Danh sách lớp mô phỏng',`<div class="scroll"><table class="simpleTable"><tr><th>Mã</th><th>Nhãn</th><th>Thi đua</th><th>Ghi chú</th><th></th></tr>${data.students.map(s=>`<tr><td><b>${esc(s.id)}</b></td><td>${esc(s.name)}</td><td>${s.score}</td><td><small>${esc(s.note||'—')}</small></td><td><button class="btn mini ghost" onclick="editStudent('${esc(s.id)}')">Sửa</button></td></tr>`).join('')}</table></div>`)}`)}
function addStudent(){let id=$('sid').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),name=$('sname').value.trim();if(!id||!name)return flash('Nhập mã và nhãn hiển thị');if(data.students.some(s=>s.id===id))return flash('Mã đã tồn tại');data.students.push({id,name,score:0,note:''});save();log('Thêm mã lớp '+id);nav('homeroom')}
function editStudent(id){let s=data.students.find(x=>x.id===id);if(!s)return;let name=prompt('Nhãn hiển thị (không dùng tên thật)',s.name);if(name===null)return;let note=prompt('Ghi chú ngắn không nhạy cảm',s.note);if(note===null)return;s.name=name.trim().slice(0,70);s.note=note.trim().slice(0,140);save();log('Cập nhật mã '+id);nav('homeroom')}
function seatsPage(){let students=data.seats.length?data.seats:data.students.slice(0,36).map(s=>s.id);return page('Sơ đồ lớp học','Xáo trộn sơ đồ chỗ ngồi theo mã học sinh, phù hợp tạo phương án phân nhóm và quản lý hoạt động trong tiết học.',`${card('Sơ đồ 6 cột — tối đa 36 vị trí',`<div class="row" style="margin-bottom:14px"><button class="btn teal" onclick="randomSeats()">Xếp chỗ ngẫu nhiên</button><button class="btn ghost" onclick="resetSeats()">Mặc định</button><span class="muted compact">Bàn giáo viên ở phía trên</span></div><div class="hint" style="text-align:center">BẢNG / BÀN GIÁO VIÊN</div><div class="seatgrid">${Array.from({length:36},(_,i)=>{let id=students[i],s=data.students.find(s=>s.id===id);return `<div class="seat"><b>${s?esc(s.id):'—'}</b><small>${s?esc(s.name):'Trống'}</small></div>`}).join('')}</div>`)}`)}
function randomSeats(){data.seats=shuffle(data.students.map(s=>s.id)).slice(0,36);save();log('Trộn sơ đồ lớp');nav('seats')}function resetSeats(){data.seats=[];save();nav('seats')}
function rankPage(){let list=[...data.students].sort((a,b)=>b.score-a.score);return page('Thi đua & Gọi tên ngẫu nhiên','Ghi nhận điểm cộng/trừ cho hoạt động trong tiết Hóa; chọn ngẫu nhiên bằng mã để tăng tương tác.',`<div class="grid two">${card('Gọi tên ngẫu nhiên',`<p>Chỉ dùng mã học sinh; giáo viên quyết định mức độ phù hợp với điều kiện lớp.</p><button class="btn teal" onclick="pickStudent()">🎲 Gọi ngẫu nhiên</button><div class="bigresult" id="picked">—</div><p class="muted">Không tự động gán điểm danh hay đánh giá học sinh.</p>`)}${card('Cộng / trừ điểm hoạt động',`<div class="row"><div class="field"><label>Mã học sinh</label><select id="rankStu">${data.students.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} - ${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Điểm thay đổi</label><select id="rankDelta"><option value="1">+1</option><option value="2">+2</option><option value="-1">−1</option></select></div></div><br><button class="btn" onclick="addPoint()">Ghi điểm</button><p class="compact muted">Đây là điểm hoạt động của ứng dụng, không phải đánh giá hạnh kiểm/điểm kiểm tra chính thức.</p>`)}</div><br>${card('Bảng điểm hoạt động',`<div class="scroll"><table class="simpleTable"><tr><th>Hạng</th><th>Mã</th><th>Học sinh</th><th>Điểm hoạt động</th></tr>${list.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td><b>${s.score}</b></td></tr>`).join('')}</table></div>`)}`)}
function pickStudent(){if(!data.students.length)return flash('Chưa có học sinh');let s=data.students[Math.floor(Math.random()*data.students.length)];$('picked').textContent=s.id+' • '+s.name;log('Gọi mã ngẫu nhiên '+s.id)}function addPoint(){let s=data.students.find(x=>x.id===$('rankStu').value);if(!s)return;s.score+=Number($('rankDelta').value);save();log('Điểm hoạt động '+s.id);nav('rank')}
function jobsPage(){return page('Thời khóa biểu & Công việc','Quản lý nhiệm vụ chuyên môn và mốc thời gian. Lưu cục bộ, không đồng bộ Google Calendar hay cơ sở dữ liệu của nhà trường.',`<div class="grid two">${card('Giao việc cho chính mình',`<div class="stack"><div class="field"><label>Nội dung công việc</label><input id="jobName" placeholder="Chuẩn bị bài: Phản ứng oxi hóa - khử"></div><div class="row"><div class="field"><label>Ngày cần hoàn thành</label><input id="jobDate" type="date"></div><div class="field"><label>Khối</label><select id="jobGrade"><option>10</option><option>11</option><option>12</option><option>Chủ nhiệm</option></select></div></div><button class="btn teal" onclick="addJob()">Thêm công việc</button></div>`)}${card('Công việc đã ghi',`<div class="scroll"><table class="simpleTable"><tr><th>Xong</th><th>Công việc</th><th>Hạn</th></tr>${data.tasks.map(x=>`<tr><td><input type="checkbox" ${x.done?'checked':''} style="width:auto" onchange="toggleJob(${x.id})"></td><td>${esc(x.name)} <small>(${esc(x.g)})</small></td><td>${esc(x.date)}</td></tr>`).join('')}</table>${!data.tasks.length?'<div class="empty">Chưa có công việc.</div>':''}</div>`)}</div>`)}
function addJob(){let name=$('jobName').value.trim(),date=$('jobDate').value;if(!name||!date)return flash('Nhập nội dung và ngày');data.tasks.push({id:Date.now(),name,date,g:$('jobGrade').value,done:false});save();log('Thêm công việc '+name);nav('jobs')}function toggleJob(id){let x=data.tasks.find(x=>x.id===id);if(x){x.done=!x.done;save();log('Cập nhật công việc');nav('jobs')}}
function docsPage(){return page('Tài liệu & Thông tư','Khu vực liên kết tới nguồn chính thức, phục vụ tra cứu căn cứ và cập nhật kiến thức; đây không phải cơ sở dữ liệu pháp luật tự động.',`${card('Nguồn tham khảo chính thức',`<div class="stack"><div><h3>Chương trình GDPT 2018</h3><p>Văn bản chính thức trên Cổng Bộ GD&ĐT; đối chiếu với chương trình môn Hóa học đang sử dụng.</p><a target="_blank" rel="noopener" href="https://moet.gov.vn/">Bộ Giáo dục và Đào tạo ↗</a></div><hr class="sep"><div><h3>Dữ liệu cá nhân và bảo mật</h3><p>Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15, có hiệu lực từ 01/01/2026.</p><a target="_blank" rel="noopener" href="https://chinhphu.vn/?classid=1&docid=214590&orggroupid=1&pageid=27160">Văn bản trên Cổng Chính phủ ↗</a></div><hr class="sep"><div><h3>Các kỳ thi đánh giá năng lực / tư duy</h3><p>Ưu tiên dạng thức chính thức của đơn vị tổ chức và kiểm tra thay đổi theo năm.</p><a target="_blank" rel="noopener" href="https://www.hsa.edu.vn/huong-dan/dang-thuc-bai-thi">HSA 2026 ↗</a> · <a target="_blank" rel="noopener" href="https://www.hust.edu.vn/">TSA - Đại học Bách khoa Hà Nội ↗</a></div></div>`)}`)}
function historyPage(){return page('Lịch sử tạo & Sao lưu','Dữ liệu thử nghiệm nằm trong localStorage của trình duyệt. Có thể xuất file JSON dự phòng và nhập lại khi cần.',`<div class="row" style="margin-bottom:16px"><button class="btn teal" onclick="backup()">Xuất sao lưu JSON</button><label class="btn ghost" style="cursor:pointer">Nhập sao lưu<input type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></label><button class="btn red" onclick="clearData()">Khôi phục dữ liệu mẫu</button></div>${card('Nhật ký hoạt động gần đây',`<table class="simpleTable"><tr><th>Thời điểm</th><th>Thao tác</th></tr>${data.history.slice(0,35).map(h=>`<tr><td>${esc(h.t)}</td><td>${esc(h.name)}</td></tr>`).join('')}</table>${!data.history.length?'<div class="empty">Chưa có hoạt động.</div>':''}`)}<br>${card('Bản thảo từng lưu',data.templates.length?`<div class="scroll"><table class="simpleTable"><tr><th>Thời điểm</th><th>Loại</th><th>Khối</th><th></th></tr>${data.templates.slice(0,20).map((t,i)=>`<tr><td>${esc(t.time)}</td><td>${esc(t.mode)}</td><td>${esc(t.grade)}</td><td><button class="btn ghost mini" onclick="downloadSaved(${i})">Tải TXT</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa lưu bản thảo.</div>')}`)}
function downloadSaved(i){let t=data.templates[i];if(t)downloadFile('EduPlan_lichsu_'+(i+1)+'.txt',t.text)}function backup(){downloadFile('EduPlan_HoaHoc_Backup.json',JSON.stringify(data,null,2),'application/json');log('Sao lưu dữ liệu')}
function restore(ev){let file=ev.target.files[0];if(!file)return;file.text().then(t=>{try{let d=JSON.parse(t);if(!d||!Array.isArray(d.questions)||!Array.isArray(d.students)||!Array.isArray(d.attempts))throw Error();if(!confirm('Thay thế dữ liệu hiện tại bằng bản sao lưu?'))return;data=d;for(let k of Object.keys(INIT))if(!Array.isArray(data[k]))data[k]=[];save();nav('history');flash('Đã nhập sao lưu')}catch(e){flash('File sao lưu không đúng cấu trúc')}})}
function clearData(){if(!confirm('Xóa toàn bộ dữ liệu đã nhập trên trình duyệt này và trở lại dữ liệu mẫu?'))return;data=structuredClone(INIT);examSet=[];save();nav('home');flash('Đã khôi phục bản mẫu')}
function guidePage(){return page('Hướng dẫn sử dụng EduPlan AI','Cách dùng bản thử nghiệm, ý nghĩa nhãn trạng thái và hướng mở rộng trong phiên bản được triển khai thật.',`${card('Bắt đầu trong 5 bước',`<ol><li>Chọn khối Hóa 10, 11 hoặc 12 ở góc phải.</li><li>Vào <b>Tạo & Trộn đề</b> → trộn câu hỏi và làm bài mẫu → nộp bài.</li><li>Vào <b>Dashboard kết quả</b> xem điểm và phân tích theo chủ đề.</li><li>Vào <b>Kế hoạch dạy học</b> tạo khung bài dạy, kiểm định nội dung và lưu bản thảo.</li><li>Thử <b>EduPlan AI Ink</b>, <b>Sơ đồ lớp</b>, <b>Thi đua</b>; vào <b>Lịch sử</b> để sao lưu.</li></ol><div class="hint">Phiên bản hiện tại dùng để trình diễn luồng thao tác. Để mở trên máy tính: tải file HTML rồi nhấp đúp mở bằng trình duyệt Chrome/Edge.</div>`)}<br>${card('Ý nghĩa nhãn chức năng',`<p><span class="tag">Không nhãn</span> Đã có thao tác thực tế ở mức cục bộ; không đồng nghĩa với hệ thống sản xuất hoàn chỉnh.</p><p><span class="tag demo">DEMO</span> Có minh họa hoặc công cụ tạo mẫu, chưa kết nối AI hoặc chưa đủ dữ liệu chuẩn hóa.</p><p><span class="tag plan">V2</span> Đã mô tả quy trình nhưng chưa tích hợp dịch vụ OCR/PDF/máy chủ.</p><p><b>Cảnh báo:</b> Xóa dữ liệu trình duyệt sẽ làm mất nội dung lưu; điểm số/thông tin học sinh không được đồng bộ và không xác minh danh tính. Không dùng dữ liệu thật trong bản thử nghiệm.</p>`)}`)}
$('grade').value=grade;$('grade').onchange=e=>{grade=e.target.value;store.setItem('eduplan_grade',grade);examSet=[];nav(current)};initSide();nav('home');
</script><script>
/* EduPlan 1.1: KHGD -> KHBD workflow based on reference frameworks, local-only, no AI API */
(()=>{
'use strict';
const oldTemplatePage=templatePage;
const oldGuidePage=guidePage;
const oldHomePage=homePage;
const EXKEY='eduplan_planplus_v11';
const escp=(s)=>esc(String(s??''));
const extraCss=`<style>
.plan-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.plan-actions .btn{font-size:12px}
.plan-edit{width:100%;min-width:840px;border-collapse:collapse}.plan-edit th{background:#eaf1f8;color:#23466b;font-size:12px;text-align:left;padding:10px;border-bottom:1px solid #cbd9e7}.plan-edit td{border-bottom:1px solid #e4ebf2;padding:7px;vertical-align:middle}.plan-edit input{min-width:65px;font-size:12px;padding:8px}.plan-edit button{white-space:nowrap}
.pl-status{display:inline-flex;background:#f2f6fb;color:#1f577e;padding:6px 10px;border-radius:9px;font-weight:700;font-size:12px}.pl-notice{margin-top:12px;padding:11px 14px;background:#fff8e9;border-left:3px solid #d49b3b;border-radius:7px}.pl-result{line-height:1.8}.pl-bad{color:#9c2933}.pl-good{color:#0a806e}.pl-act{background:#f8fafc;border:1px solid #e1e8f0;border-radius:12px;padding:14px;margin-bottom:12px}.pl-act>h3{margin:0 0 12px}.pl-help{font-size:12px;color:#69788f}.pl-label{font-size:11px;font-weight:700;color:#36536b;letter-spacing:.4px}
.pl-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pl-col{display:grid;gap:12px}.plan-edit .btn{padding:7px 10px}.pl-checks{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.pl-checks label{display:flex;align-items:flex-start;gap:9px;font-weight:500}.pl-checks input{width:17px;height:17px;margin-top:2px;flex:none}.pl-pill{padding:3px 9px;border-radius:20px;background:#e5f6f0;color:#077566;font-size:11px;font-weight:800;white-space:nowrap}
@media(max-width:700px){.pl-row,.pl-checks{grid-template-columns:1fr}.plan-edit{min-width:760px}}
</style>`;
if(!document.querySelector('#planplus-style')){let st=document.createElement('style');st.id='planplus-style';st.innerHTML=extraCss.replace(/<\/?style>/g,'');document.head.append(st)}
function sampleRows(g){let tt=topics[g]||topics['10'];return tt.slice(0,3).map((title,i)=>({uid:'b'+(i+1),title,periods:2,week:'',equipment:'',place:'Lớp học',type:'Bài học'}))}
function freshPlan(g){return {school:'Trường THPT Hòn Đất',department:'Tổ chuyên môn',teacher:'Lê Bá Nhẫn',year:'2026 - 2027',book:'',grade:g,target:'',duties:'',notes:'',rows:sampleRows(g),checked:false,updated:''}}
let plus;try{plus=JSON.parse(store.getItem(EXKEY))||{}}catch(e){plus={}};
if(!plus.plans||typeof plus.plans!=='object')plus.plans={};if(!plus.lessons||typeof plus.lessons!=='object')plus.lessons={};if(!plus.selected||typeof plus.selected!=='object')plus.selected={};
function put(){try{store.setItem(EXKEY,JSON.stringify(plus))}catch(e){flash('Không thể lưu dữ liệu trên trình duyệt')}}
function plan(g=grade){if(!plus.plans[g]){plus.plans[g]=freshPlan(g);put()}return plus.plans[g]}
function myLessonId(g=grade){let pp=plan(g),cur=plus.selected[g];if(!pp.rows.some(r=>r.uid===cur))cur=pp.rows[0]?.uid||'none';plus.selected[g]=cur;return cur}
function defaultActivity(name){return {goal:'',content:'',product:'',method:''}}
const stages=['Khởi động / Xác định vấn đề','Hình thành kiến thức','Luyện tập','Vận dụng'];
function lesson(g=grade,uid=myLessonId(g)){let key=g+'_'+uid,p=plan(g),ref=p.rows.find(r=>r.uid===uid);if(!plus.lessons[key])plus.lessons[key]={title:ref?.title||'',periods:ref?.periods||1,knowledge:'',competences:'',qualities:'',equipment:'',setting:'',safety:'',differentiation:'',evaluation:'',reflection:'',activities:stages.map(defaultActivity),reviewChem:false,reviewSafe:false,reviewCurr:false,reviewAssess:false,updated:''};return plus.lessons[key]}
function f(label,id,val='',opts=''){return `<div class="field"><label for="${id}">${escp(label)}</label><input id="${id}" value="${escp(val)}" ${opts}></div>`}
function ta(label,id,val='',rows=3){return `<div class="field"><label for="${id}">${escp(label)}</label><textarea id="${id}" rows="${rows}" style="min-height:${rows===2?65:94}px">${escp(val)}</textarea></div>`}
function val(id){return ($(''+id)?.value||'').trim()}
function planRead(){let p=plan(),ids={school:'epSchool',department:'epDept',teacher:'epTeacher',year:'epYear',book:'epBook',target:'epTarget',duties:'epDuties',notes:'epNotes'};for(let [k,id] of Object.entries(ids))p[k]=val(id);p.rows=[...document.querySelectorAll('[data-pprow]')].map(tr=>{let fields={};tr.querySelectorAll('[data-field]').forEach(el=>fields[el.dataset.field]=el.value.trim());return {uid:tr.dataset.pprow,type:fields.type||'Bài học',title:fields.title||'',periods:Number(fields.periods)||0,week:fields.week||'',equipment:fields.equipment||'',place:fields.place||''}});return p}
function renderRows(list){let rows=list.map((r,i)=>`<tr data-pprow="${escp(r.uid)}"><td>${i+1}</td><td><input aria-label="Bài học ${i+1}" data-field="title" value="${escp(r.title)}"></td><td><select data-field="type"><option ${r.type==='Bài học'?'selected':''}>Bài học</option><option ${r.type==='Chuyên đề lựa chọn'?'selected':''}>Chuyên đề lựa chọn</option></select></td><td><input aria-label="Số tiết" data-field="periods" type="number" min="1" max="40" value="${escp(r.periods)}"></td><td><input aria-label="Tuần" data-field="week" placeholder="Tuần 1" value="${escp(r.week)}"></td><td><input aria-label="Thiết bị" data-field="equipment" placeholder="Thiết bị" value="${escp(r.equipment)}"></td><td><input aria-label="Địa điểm" data-field="place" value="${escp(r.place)}"></td><td><button class="btn ghost mini" onclick="planRemove('${escp(r.uid)}')" aria-label="Xóa dòng">Xóa</button></td></tr>`).join('');return `<div class="scroll"><table class="plan-edit"><thead><tr><th>STT</th><th>Bài học / chủ đề</th><th>Loại</th><th>Số tiết</th><th>Thời điểm</th><th>Thiết bị</th><th>Địa điểm</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}
function planPage(){let p=plan(),count=p.rows.reduce((s,r)=>s+Math.max(0,Number(r.periods)||0),0);return page('Kế hoạch giáo dục | Phụ lục III','Bản soạn thảo theo các nhóm trường dữ liệu của Công văn 5512. Giáo viên tự xác nhận phân phối chương trình, thời điểm, thiết bị và nhiệm vụ khác.',`
<div class="hint"><b>Quy trình liên thông:</b> Nhập phân phối chương trình → kiểm tra trường bắt buộc → lưu → chọn bài tương ứng ở <b>Kế hoạch bài dạy</b> → xuất Word. Không có AI sinh nội dung tự động và không thay thế phê duyệt của tổ chuyên môn.</div>
<div class="grid two">${card('Thông tin giáo viên & nhà trường',`<div class="stack"><div class="pl-row">${f('Trường','epSchool',p.school)}${f('Tổ / nhóm chuyên môn','epDept',p.department)}</div><div class="pl-row">${f('Họ tên giáo viên','epTeacher',p.teacher)}${f('Năm học','epYear',p.year)}</div><div class="pl-row">${f('Bộ SGK / phạm vi áp dụng','epBook',p.book)}${f('Tổng số tiết đối chiếu (nếu đã được duyệt)','epTarget',p.target,'type="number" min="1" placeholder="Để trống nếu chưa xác định"')}</div></div>`)}${card('Trạng thái kiểm tra',`<div class="pl-status">Hóa học ${grade} • ${p.rows.length} dòng • ${count} tiết minh họa</div><p class="pl-help" style="margin-top:10px">Các dòng khởi tạo là ví dụ nhập liệu, không phải phân phối chương trình chính thức. Phải thay bằng kế hoạch do tổ/nhà trường duyệt.</p><div class="plan-actions"><button class="btn teal" onclick="planSave()">Lưu kế hoạch</button><button class="btn ghost" onclick="planValidate()">Kiểm tra thiếu sót</button><button class="btn ghost" onclick="planAddRow()">+ Thêm bài / chuyên đề</button></div><div id="planCheck" class="pl-result"></div>`)}</div>
<br>${card('I. Kế hoạch dạy học – phân phối chương trình và chuyên đề lựa chọn',`${renderRows(p.rows)}<p class="pl-help">Tại cấp THPT, những dòng chọn “Chuyên đề lựa chọn” sẽ được tách thành bảng riêng khi xuất Word.</p>`) }
<br><div class="grid two">${card('II. Nhiệm vụ khác (nếu có)',`${ta('Bồi dưỡng HSG, hoạt động STEM, công tác kiêm nhiệm…','epDuties',p.duties,4)}`)}${card('Lưu ý và điều chỉnh',`${ta('Điều chỉnh theo thực tế nhà trường và lớp học','epNotes',p.notes,4)}<div class="plan-actions"><button class="btn teal" onclick="planExport()">Xuất Word (.doc)</button><button class="btn ghost" onclick="planPrompt()">Tạo câu lệnh AI kiểm tra</button><button class="btn ghost" onclick="planToLesson()">Chuyển sang KHBD →</button></div>`)}</div><br><div id="planPromptBox"></div>`, 'PLANFLOW AI • BẢN SOẠN THẢO 1.1')}
function planSave(){let p=planRead();p.updated=new Date().toLocaleString('vi-VN');put();log('Cập nhật KHGD Hóa '+grade);flash('Đã lưu KHGD trên trình duyệt');return p}
function planErrors(p){let err=[];for(let k of ['school','department','teacher','year','book'])if(!p[k])err.push('Thiếu thông tin '+({school:'trường',department:'tổ chuyên môn',teacher:'giáo viên',year:'năm học',book:'bộ sách hoặc căn cứ nội dung'}[k]));if(!p.rows.length)err.push('Chưa có bài/chủ đề');p.rows.forEach((r,i)=>{if(!r.title)err.push('Dòng '+(i+1)+': thiếu tên bài');if(!(r.periods>0))err.push('Dòng '+(i+1)+': số tiết không hợp lệ');if(!r.week)err.push('Dòng '+(i+1)+': chưa có tuần thực hiện');if(!r.equipment)err.push('Dòng '+(i+1)+': chưa ghi thiết bị/học liệu (nếu không sử dụng cần ghi rõ)');if(!r.place)err.push('Dòng '+(i+1)+': thiếu địa điểm')});let sum=p.rows.reduce((s,r)=>s+(r.periods||0),0);if(p.target&&Number(p.target)!==sum)err.push('Tổng số tiết trong bảng ('+sum+') khác tổng đối chiếu ('+p.target+').');return err}
function planValidate(){let p=planRead(),errs=planErrors(p),box=$('planCheck');box.innerHTML=errs.length?'<b class="pl-bad">Cần rà soát '+errs.length+' mục</b><ol>'+errs.map(s=>'<li>'+escp(s)+'</li>').join('')+'</ol>':'<b class="pl-good">Đã điền đầy đủ các trường kiểm tra tự động.</b><p class="pl-help">Chưa xác nhận tính chính xác về chương trình và tính hợp lệ của kế hoạch.</p>';return errs}
function planAddRow(){let p=planSave();p.rows.push({uid:'b'+Date.now(),title:'',type:'Bài học',periods:1,week:'',equipment:'',place:'Lớp học'});put();nav('eduplan')}
function planRemove(uid){let p=planSave();if(p.rows.length<2)return flash('Cần tối thiểu 1 dòng.');if(!confirm('Xóa dòng và ngắt liên kết KHBD nếu có?'))return;p.rows=p.rows.filter(r=>r.uid!==uid);put();nav('eduplan')}
function planToLesson(){planSave();nav('lesson')}
function lessonPage(){let p=plan(),uid=myLessonId(),L=lesson(),ref=p.rows.find(r=>r.uid===uid)||{};let selects=p.rows.map((r,i)=>`<option value="${escp(r.uid)}" ${r.uid===uid?'selected':''}>${i+1}. ${escp(r.title||'(Chưa đặt tên)')}</option>`).join('');let activities=stages.map((stage,i)=>{let a=L.activities[i]||defaultActivity();return `<div class="pl-act"><h3>${i+1}. ${stage}</h3><div class="pl-row">${ta('Mục tiêu cụ thể','lGoal'+i,a.goal,2)}${ta('Nội dung / nhiệm vụ học tập','lContent'+i,a.content,2)}${ta('Sản phẩm học tập cần thu','lProduct'+i,a.product,2)}${ta('Tổ chức thực hiện (giao - làm - báo cáo - nhận xét)','lMethod'+i,a.method,2)}</div></div>`}).join('');return page('Kế hoạch bài dạy | Phụ lục IV','Soạn KHBD bám một bài/chủ đề đã có trong KHGD. Mỗi hoạt động được lưu theo mục tiêu – nhiệm vụ – sản phẩm – cách tổ chức, có thẩm định của giáo viên.',`
<div class="hint"><b>Đang liên kết KHGD:</b> Hóa học ${grade} • Năm học ${escp(p.year)} • Trạng thái: bản thảo có kiểm tra trường bắt buộc. Để thay chủ đề, mở KHGD và chỉnh phân phối chương trình.</div>
${card('Chọn bài trong kế hoạch giáo dục',`<div class="pl-row"><div class="field"><label>Bài học / chủ đề lấy từ KHGD</label><select id="lessonSelector" onchange="selectLesson(this.value)">${selects}</select></div>${f('Số tiết bài dạy (được phép điều chỉnh)','lPeriods',L.periods,'type="number" min="1" max="40"')}</div><p class="pl-help" style="margin-top:10px">Theo KHGD: ${escp(ref.periods||'?')} tiết, ${escp(ref.week||'chưa có tuần')} • Kiểm tra sẽ cảnh báo nếu số tiết khác nhau.</p>`) }
<br><div class="grid two">${card('I. Mục tiêu',`<div class="pl-col">${f('Tên bài dạy','lTitle',L.title)}${ta('1. Kiến thức / yêu cầu cần đạt cụ thể','lKnowledge',L.knowledge,3)}${ta('2. Năng lực (chung và đặc thù Hóa học)','lCompetences',L.competences,3)}${ta('3. Phẩm chất','lQualities',L.qualities,2)}</div>`) }${card('II. Thiết bị dạy học & học liệu',`<div class="pl-col">${ta('Thiết bị, hóa chất, mô phỏng, học liệu','lEquipment',L.equipment,3)}${ta('Không gian tổ chức và điều kiện thực tế','lSetting',L.setting,2)}${ta('Phân hóa & hỗ trợ học sinh','lDifferent',L.differentiation,2)}${ta('Lưu ý an toàn thí nghiệm','lSafety',L.safety,2)}</div>`)}</div>
<br>${card('III. Tiến trình dạy học – 4 hoạt động',activities)}<br><div class="grid two">${card('Đánh giá & rút kinh nghiệm',`${ta('Tiêu chí, công cụ đánh giá (bảng kiểm/rubric/câu hỏi)','lEvaluation',L.evaluation,4)}${ta('Điều chỉnh sau tiết dạy','lReflection',L.reflection,3)}`)}${card('Thẩm định trước khi dùng',`<div class="pl-checks"><label><input id="lRChem" type="checkbox" ${L.reviewChem?'checked':''}> Tôi đã kiểm tra công thức, phương trình và số liệu Hóa học.</label><label><input id="lRSafe" type="checkbox" ${L.reviewSafe?'checked':''}> Tôi đã kiểm tra điều kiện và an toàn thí nghiệm.</label><label><input id="lRCurr" type="checkbox" ${L.reviewCurr?'checked':''}> Tôi đã đối chiếu yêu cầu cần đạt và SGK đang sử dụng.</label><label><input id="lRAssess" type="checkbox" ${L.reviewAssess?'checked':''}> Tôi đã kiểm tra nhiệm vụ và đánh giá phù hợp.</label></div><div class="plan-actions"><button class="btn teal" onclick="lessonSave()">Lưu KHBD</button><button class="btn ghost" onclick="lessonValidate()">Kiểm tra KHBD</button><button class="btn ghost" onclick="lessonExport()">Xuất Word (.doc)</button><button class="btn ghost" onclick="lessonPrompt()">Tạo câu lệnh AI kiểm tra</button></div><div id="lessonCheck" class="pl-result"></div>`)}</div><br><div id="lessonPromptBox"></div>`, 'PLANFLOW AI • BẢN SOẠN THẢO 1.1')}
function lessonRead(){let l=lesson(),map={title:'lTitle',periods:'lPeriods',knowledge:'lKnowledge',competences:'lCompetences',qualities:'lQualities',equipment:'lEquipment',setting:'lSetting',safety:'lSafety',differentiation:'lDifferent',evaluation:'lEvaluation',reflection:'lReflection'};for(let [k,id] of Object.entries(map))l[k]=k==='periods'?Number(val(id))||0:val(id);l.activities=stages.map((_,i)=>({goal:val('lGoal'+i),content:val('lContent'+i),product:val('lProduct'+i),method:val('lMethod'+i)}));for(let [k,id] of Object.entries({reviewChem:'lRChem',reviewSafe:'lRSafe',reviewCurr:'lRCurr',reviewAssess:'lRAssess'}))l[k]=Boolean($(id)?.checked);return l}

function csvCells(line,delimiter){let a=[],v='',quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){v+='"';i++}else quote=!quote;}else if(c===delimiter&&!quote){a.push(v);v=''}else v+=c;}a.push(v);return a}
function parseCSV(t){let lines=String(t).replace(/^\ufeff/,'').replace(/\r\n?/g,'\n').split('\n').filter(x=>x.trim());if(!lines.length)throw Error('Tệp CSV trống');const dl=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';return lines.map(s=>csvCells(s,dl).map(x=>x.trim()))}
function csvV(s){let t=String(s??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}

/* ChemGuard Lite: extended chemical formula parser including nested brackets and hydrate dot. */
function parseOneFormula(s){let t=s.replace(/[\[\{]/g,'(').replace(/[\]\}]/g,')');let tokens=t.match(/[A-Z][a-z]?|\d+|[()]/g)||[];if(tokens.join('')!==t||!tokens.length)throw Error('Công thức chứa ký hiệu chưa hỗ trợ: '+s);let pos=0;
 function run(nested=false){let result={},found=false;while(pos<tokens.length){let sym=tokens[pos++];if(sym===')'){if(!nested)throw Error('Ngoặc đóng dư');if(!found)throw Error('Ngoặc rỗng');return result}let part;if(sym==='('){part=run(true)}else if(atomMass[sym]!==undefined)part={[sym]:1};else throw Error('Ký hiệu hoặc nguyên tố không hợp lệ: '+sym);found=true;let n=1;if(/^\d+$/.test(tokens[pos]||''))n=Number(tokens[pos++]);if(n<1||n>10000)throw Error('Chỉ số không hợp lệ');for(let [el,num] of Object.entries(part))result[el]=(result[el]||0)+num*n;}if(nested)throw Error('Thiếu dấu đóng ngoặc');return result}
 return run();}
window.parseFormula=parseFormula=function(input){let s=chemNormalize(input).replace(/[·•]/g,'.');if(!s)throw Error('Hãy nhập công thức');const parts=s.split('.');if(parts.some(x=>!x))throw Error('Vị trí dấu ngậm nước không hợp lệ');let counts={};for(let i=0;i<parts.length;i++){let part=parts[i],factor=1;if(i>0){let m=part.match(/^(\d+)(.*)$/);if(m){factor=Number(m[1]);part=m[2]}}if(i===0&&/^\d/.test(part))throw Error('Không nhập hệ số phản ứng trước công thức');if(!part||factor<=0||factor>10000)throw Error('Hệ số ngậm nước không hợp lệ');for(let [k,v] of Object.entries(parseOneFormula(part)))counts[k]=(counts[k]||0)+v*factor}return counts};
chemPage=function(){return OLD.chemPage()+`<div class="grid two" style="margin-top:15px">${card('ChemGuard Lite — kiểm tra cân bằng nguyên tử',`<p>Dán phương trình trung hòa điện tích đã có hệ số để kiểm tra bảo toàn số nguyên tử hai vế. Ví dụ: 4Fe + 3O2 → 2Fe2O3.</p><textarea id="chemEquation" placeholder="2H2 + O2 -> 2H2O">4Fe + 3O2 -> 2Fe2O3</textarea><div class="row"><button class="btn teal" onclick="window.edpBalance()">Kiểm tra số nguyên tử</button></div><div id="balanceFeedback" style="margin-top:12px"></div><p class="compact muted">Giới hạn: không kiểm tra điện tích, electron, điều kiện phản ứng hoặc tính khả thi của phương trình.</p>`)}${card('Bổ sung cho công cụ tính M',`<p>Hỗ trợ công thức có ngoặc tròn, ngoặc vuông và <b>muối ngậm nước</b>.</p><div class="samples"><button class="sample" onclick="$('formula').value='CuSO4·5H2O';massCalc()">CuSO₄·5H₂O</button><button class="sample" onclick="$('formula').value='Al2(SO4)3';massCalc()">Al₂(SO₄)₃</button></div><p class="compact muted">Các nguyên tử khối mang tính học tập, không dùng cho kiểm nghiệm định lượng chính xác cao.</p>`)}</div>`};
function parseSide(text){let out={};let xs=text.split(/\s*\+\s*/);for(let word of xs){let mt=word.trim().match(/^(\d+)\s*(.+)$/),coef=mt?Number(mt[1]):1,form=mt?mt[2]:word.trim();if(!(coef>0&&coef<10000))throw Error('Hệ số phương trình không hợp lệ');let cnt=parseFormula(form);for(const [e,n] of Object.entries(cnt))out[e]=(out[e]||0)+n*coef}return out}
window.edpBalance=function(){try{let eq=$('chemEquation').value.replace(/⇌|⟶|→|⇒|=/g,'->').split('->');if(eq.length!==2||!eq[0].trim()||!eq[1].trim())throw Error('Nhập một mũi tên phản ứng, ví dụ 2H2 + O2 -> 2H2O');let l=parseSide(eq[0]),r=parseSide(eq[1]);let keys=[...new Set([...Object.keys(l),...Object.keys(r)])].sort();const ok=keys.every(k=>(l[k]||0)===(r[k]||0));$('balanceFeedback').innerHTML=`<div class="hint ${ok?'':'warn'}"><b>${ok?'Đã bảo toàn số nguyên tử.':'Chưa cân bằng số nguyên tử.'}</b><div class="scroll"><table class="simpleTable"><thead><tr><th>Nguyên tố</th><th>Vế trái</th><th>Vế phải</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${k}</td><td>${l[k]||0}</td><td>${r[k]||0}</td></tr>`).join('')}</tbody></table></div></div>`;}catch(e){setNote('balanceFeedback',e.message,false)}};

function validQuestion(q){const base=String(q.stem||'').trim()&&['10','11','12'].includes(String(q.g));if(!base)return false;if(qtype(q)==='mcq')return Array.isArray(q.ops)&&q.ops.length===4&&q.ops.every(x=>String(x).trim())&&Number.isInteger(q.ans)&&q.ans>=0&&q.ans<=3;if(qtype(q)==='tf')return q.ops?.length===4&&q.ans?.length===4&&q.ans.every(x=>typeof x==='boolean');return qtype(q)==='short'&&String(q.ans??'').trim().length>0}
function examControls(){let g=data.questions.filter(x=>x.g===grade),counts={mcq:0,tf:0,short:0};g.forEach(q=>counts[qtype(q)]++);return `<div class="card" style="margin-top:15px"><h2>Định dạng đánh giá 2025 – 3 loại câu hỏi</h2><p>Ngân hàng khối ${grade}: ${counts.mcq} câu nhiều lựa chọn; ${counts.tf} câu đúng/sai bốn ý; ${counts.short} câu trả lời ngắn. <b>Điểm thử nghiệm:</b> mỗi câu tối đa 1 điểm; mỗi ý đúng/sai = 0,25 điểm (không phải quy tắc điểm thi tốt nghiệp chính thức).</p><div class="row"><div class="field" style="max-width:230px"><label>Chọn loại để tạo đề</label><select id="edpType"><option value="all">Cả 3 loại</option><option value="mcq">Nhiều lựa chọn</option><option value="tf">Đúng / Sai</option><option value="short">Trả lời ngắn</option></select></div><label class="compact"><input style="width:auto" id="edpShuffleOps" type="checkbox" checked> Trộn vị trí phương án A–D</label></div><div class="row"><button class="btn teal" onclick="window.edpGenerate()">Tạo đề theo bộ lọc</button><button class="btn ghost" onclick="window.edpExamDocx(false)">Xuất đề DOCX</button><button class="btn ghost" onclick="window.edpExamDocx(true)">Xuất đề kèm đáp án DOCX</button></div></div>`}
function importUI(){return `<div class="card" style="margin-top:15px"><h2>Nhập nhanh câu hỏi từ văn bản đã kiểm tra</h2><p>Hỗ trợ ba loại: <b>MCQ</b>, <b>TF</b> (đúng/sai), <b>SHORT</b> (trả lời ngắn). Mỗi câu bắt đầu bằng <b>Câu 1 [MCQ]: ...</b> hoặc <b>Câu 2 [TF]: ...</b>. Đáp án phải ghi tường minh. <b>Không tự đọc trực tiếp PDF/OCR.</b></p><div class="row"><button class="btn ghost mini" onclick="window.edpImportExample()">Điền ví dụ mẫu</button><button class="btn ghost mini" onclick="window.edpExportBank()">Xuất ngân hàng JSON</button></div><textarea id="edpImportText" rows="9" placeholder="Câu 1 [MCQ]: Câu hỏi ...&#10;A. Phương án thứ nhất&#10;B. ...&#10;C. ...&#10;D. ...&#10;Đáp án: B&#10;Giải thích: ..."></textarea><div class="row"><button class="btn teal" onclick="window.edpImportPreview()">Xem trước & kiểm tra</button><button class="btn ghost" onclick="window.edpImportSave()">Nhập các câu đạt chuẩn</button></div><div id="edpImportReport" aria-live="polite" class="compact muted" style="margin-top:13px"></div></div>`}
let importDraft=[];document.addEventListener('input',e=>{if(e.target?.id==='edpImportText')importDraft=[]});
examPage=function(){return OLD.examPage().replace('<div class="grid two">', examControls()+'<div class="grid two">')+importUI()+`<div class="card" style="margin-top:15px"><h2>Quản lý ngân hàng Hóa ${grade}</h2><p>Các câu vừa nhập có thể xóa thủ công; bản mặc định là câu mẫu do EduPlan cung cấp. Việc xóa chỉ tác động dữ liệu trình duyệt hiện tại.</p><div id="edpBankZone">${bankListing()}</div></div>`};
function bankListing(){let q=data.questions.filter(x=>x.g===grade);return `<div class="scroll"><table class="simpleTable"><thead><tr><th>Loại</th><th>Chủ đề</th><th>Câu hỏi</th><th>Tác vụ</th></tr></thead><tbody>${q.slice(-60).map(v=>`<tr><td>${esc(qtype(v))}</td><td>${esc(v.topic)}</td><td>${esc(String(v.stem).slice(0,110))}</td><td><button class="btn ghost mini" onclick="window.edpDeleteQ('${esc(v.id)}')">Xóa</button></td></tr>`).join('')}</tbody></table></div>`}
window.edpDeleteQ=function(id){let i=data.questions.findIndex(q=>String(q.id)===id&&q.g===grade);if(i<0)return;if(!confirm('Xóa vĩnh viễn câu hỏi này trên thiết bị?'))return;data.questions.splice(i,1);save();log('Xóa câu hỏi '+id);nav('exam')};
window.edpImportExample=function(){$('edpImportText').value=`Câu 1 [MCQ]: Chất nào có liên kết ion điển hình?\nA. H2\nB. NaCl\nC. Cl2\nD. N2\nĐáp án: B\nGiải thích: NaCl có liên kết ion trong mạng tinh thể.\n\nCâu 2 [TF]: Xét phản ứng 2H2 + O2 → 2H2O.\na) H2 là chất khử.\nb) O2 bị oxi hóa.\nc) Số nguyên tử H bảo toàn.\nd) Phương trình đã cân bằng.\nĐáp án: Đ,S,Đ,Đ\nGiải thích: O2 nhận electron, bị khử.\n\nCâu 3 [SHORT]: Tính n khi có 9,8 g H2SO4 (M = 98 g/mol).\nĐáp án: 0,1\nGiải thích: n = m/M = 9,8/98 = 0,1 mol.`};
function parseBlocks(text){let out=[],errors=[];let blocks=text.replace(/\r\n?/g,'\n').split(/(?=^\s*Câu\s*\d+\s*(?:\[[A-Za-z]+\])?\s*[:.])/gim).filter(b=>b.trim());if(blocks.length>200)throw Error('Chỉ nhập tối đa 200 câu/lần');if(!blocks.length)throw Error('Không phát hiện "Câu 1 [MCQ]: ...".');
for(let [index,block] of blocks.entries()){try{let lines=block.split('\n').map(s=>s.trim()).filter(Boolean),head=lines.shift(),match=head.match(/^Câu\s*(\d+)\s*(?:\[(MCQ|TF|SHORT)\])?\s*[:.]\s*(.+)$/i);if(!match)throw Error('Không nhận dạng tiêu đề');let type=(match[2]||'MCQ').toLowerCase(),stem=match[3],ops=[],answer='',exp='',notes=[];for(let line of lines){let a=line.match(/^(?:Đáp\s*án|DA|Answer)\s*:\s*(.*)$/i),x=line.match(/^(?:Giải\s*thích|Lời\s*giải)\s*:\s*(.*)$/i),op=line.match(/^(?:[A-Da-d][.)]|[a-d][.)])\s*(.*)$/);if(a){answer=a[1].trim()}else if(x){exp=x[1].trim()}else if(op){ops.push(op[1].trim())}else{notes.push(line)}}if(notes.length)stem+=' '+notes.join(' ');
let ans;if(type==='mcq'){if(ops.length!==4||ops.some(x=>!x))throw Error('Cần đủ bốn phương án A–D');if(!/^[A-D]$/i.test(answer))throw Error('Đáp án phải là A, B, C hoặc D');ans=answer.toUpperCase().charCodeAt(0)-65}
else if(type==='tf'){if(ops.length!==4)throw Error('Đúng/sai cần 4 nhận định a–d');const parts=answer.split(/[,;|]/).map(s=>norm(s));if(parts.length!==4||parts.some(s=>!['đ','d','đúng','dung','true','t','s','sai','false','f'].includes(s)))throw Error('Đáp án đúng/sai: Đ,S,Đ,S');ans=parts.map(s=>['đ','d','đúng','dung','true','t'].includes(s))}
else if(type==='short'){if(!answer)throw Error('Thiếu đáp án trả lời ngắn');if(ops.length)throw Error('SHORT không dùng bốn phương án');ans=answer}else throw Error('Chỉ hỗ trợ MCQ/TF/SHORT');out.push({id:'imp_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,8),g:grade,type,topic:topics[grade][0],lv:'Thông hiểu',stem,ops,ans,exp:exp||'Giáo viên cần kiểm tra và bổ sung lời giải.'});}catch(e){errors.push(`Khối ${index+1}: ${e.message}`)}}return {out,errors}}
window.edpImportPreview=function(){try{let {out,errors}=parseBlocks($('edpImportText').value);let seen=new Set(data.questions.filter(q=>q.g===grade).map(q=>norm(q.stem)));importDraft=out.filter(q=>!seen.has(norm(q.stem)));let dup=out.length-importDraft.length;let z=`<div class="hint"><b>Hợp lệ để nhập: ${importDraft.length}</b> câu; trùng nội dung: ${dup}; lỗi: ${errors.length}. Chỉ thêm những câu đã kiểm tra khoa học.</div>`+errors.map(x=>`<p>${esc(x)}</p>`).join('')+`<p>${importDraft.slice(0,7).map(q=>`[${esc(q.type)}] ${esc(q.stem)}`).join('<br>')}</p>`;$('edpImportReport').innerHTML=z;}catch(e){importDraft=[];setNote('edpImportReport',e.message,false)}};
window.edpImportSave=function(){if(!importDraft.length)return flash('Bấm Xem trước & kiểm tra để có danh sách hợp lệ');if(!confirm(`Thêm ${importDraft.length} câu vào ngân hàng Hóa ${grade}?`))return;data.questions.push(...importDraft);const n=importDraft.length;importDraft=[];save();log(`Nhập ${n} câu MCQ/TF/SHORT Hóa ${grade}`);nav('exam');flash(`Đã lưu ${n} câu hỏi`)};
window.edpExportBank=function(){download(`EduPlan_NganHang_Hoa${grade}.json`,JSON.stringify({format:'eduplan-bank-v12',grade,questions:data.questions.filter(q=>q.g===grade)},null,2),'application/json;charset=utf-8')};
function chosenBank(){return data.questions.filter(q=>q.g===grade&&validQuestion(q))}
window.edpGenerate=function(){let topic=$('filterTopic')?.value||'all',type=$('edpType')?.value||'all',num=Math.max(1,Math.min(80,Number($('questionCount')?.value)||5)),pool=chosenBank().filter(q=>(topic==='all'||q.topic===topic)&&(type==='all'||qtype(q)===type));if(!pool.length)return flash('Chưa có câu phù hợp chủ đề và định dạng');examSet=shuffle(pool).slice(0,num).map(q=>{const c=structuredClone(q);if(qtype(c)==='mcq'&&$('edpShuffleOps')?.checked){let indices=shuffle([0,1,2,3]);c.ops=indices.map(i=>c.ops[i]);c.ans=indices.indexOf(q.ans)}return c});$('examZone').innerHTML=examHTML();$('examZone').scrollIntoView({behavior:'smooth'});log(`Tạo đề ${examSet.length} câu đa dạng - Hóa ${grade}`)};
generateExam=window.edpGenerate;
examHTML=function(){return `<div class="card"><div class="row between"><div><h2>Đề luyện tập Hóa ${grade}</h2><p>${examSet.length} câu • Ba định dạng • Tạo và chấm trên thiết bị</p></div><div style="min-width:210px"><label class="compact">Mã người làm (không ghi tên thật)</label><input id="candidate" maxlength="32" placeholder="HS01"></div></div><div id="qArea">${examSet.map((q,i)=>`<div class="question"><div class="meta">Câu ${i+1} · ${esc(q.topic)} · ${esc(q.lv)} · ${qtype(q)==='tf'?'ĐÚNG/SAI':qtype(q)==='short'?'TRẢ LỜI NGẮN':'NHIỀU LỰA CHỌN'}</div><strong>${esc(q.stem)}</strong>${qtype(q)==='mcq'?q.ops.map((x,j)=>`<label class="option"><input type="radio" name="ans${i}" value="${j}"> ${'ABCD'[j]}. ${esc(x)}</label>`).join(''):qtype(q)==='tf'?q.ops.map((x,j)=>`<div class="tfrow"><div><b>${'abcd'[j]})</b> ${esc(x)}</div><select aria-label="Câu ${i+1} ý ${'abcd'[j]}" id="tf_${i}_${j}"><option value="">Chọn Đ/S</option><option value="T">Đúng</option><option value="F">Sai</option></select></div>`).join(''):`<div class="field"><label for="short_${i}">Nhập đáp án ngắn</label><input id="short_${i}" autocomplete="off" placeholder="Ví dụ: 0,10"></div>`}</div>`).join('')}</div><div class="row"><button class="btn teal" onclick="submitExam()">Nộp bài & Chấm điểm</button><button class="btn ghost" onclick="printExam()">In đề</button></div><div id="examFeedback" aria-live="polite"></div></div>`};
function numericalAnswer(s){const x=String(s??'').trim().replace(/\s/g,'').replace(',','.');return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?$/.test(x)?Number(x):null}
function compareShort(given,correct){const a=numericalAnswer(given),b=numericalAnswer(correct);return a!==null&&b!==null?Math.abs(a-b)<=1e-6*Math.max(1,Math.abs(b)):norm(given)===norm(correct)}
submitExam=function(){if(!examSet.length)return;let candidate=String($('candidate')?.value||'KHACH').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,32)||'KHACH',credit=0,detail=[],breakdown=[];
examSet.forEach((q,i)=>{let got,part=0,correct;const type=qtype(q);if(type==='mcq'){let rd=document.querySelector(`input[name="ans${i}"]:checked`);got=rd?Number(rd.value):-1;part=got===q.ans?1:0;correct='ABCD'[q.ans];got=got<0?'Bỏ trống':'ABCD'[got]}
else if(type==='tf'){let x=q.ops.map((_,j)=>$(`tf_${i}_${j}`)?.value||'');part=x.reduce((s,v,j)=>s+((v==='T')===q.ans[j]&&v!==''?0.25:0),0);correct=q.ans.map(v=>v?'Đ':'S').join(',');got=x.map(v=>v==='T'?'Đ':v==='F'?'S':'_').join(',')}
else{got=$(`short_${i}`)?.value.trim()||'';part=got&&compareShort(got,q.ans)?1:0;correct=String(q.ans)}credit+=part;detail.push({id:q.id,topic:q.topic,lv:q.lv,type,credit:part,ok:part>=0.999});breakdown.push(`<div class="question"><div class="meta">Câu ${i+1} — ${part.toLocaleString('vi-VN')}/1 điểm</div><strong>${esc(q.stem)}</strong><p>Bạn chọn: <b>${esc(got||'Bỏ trống')}</b> | Đáp án: <b>${esc(correct)}</b></p><p>${esc(q.exp||'Giáo viên chưa bổ sung lời giải.')}</p></div>`)});
let pct=Math.round(credit/examSet.length*100),attempt={id:Date.now(),candidate,g:grade,pct,correct:credit,total:examSet.length,detail,time:now()};data.attempts.unshift(attempt);save();log(`Chấm bài ${candidate}: ${pct}%`);$('examFeedback').innerHTML=`<div class="hint"><b>Kết quả: ${credit.toLocaleString('vi-VN')} / ${examSet.length} điểm (${pct}%).</b> Cách chấm đúng/sai bản dùng thử: 0,25 điểm mỗi ý, không thay thế thang điểm kỳ thi chính thức.</div>${breakdown.join('')}`};
function docxExamBody(withAnswers=false){let a=[wp('TRƯỜNG THPT HÒN ĐẤT'),wp(`ĐỀ LUYỆN TẬP HÓA HỌC ${grade}`,'Title','center'),wp(`Số câu: ${examSet.length} | Bản xuất từ EduPlan AI 3.0`,'','center')];examSet.forEach((q,i)=>{a.push(wp(`Câu ${i+1}. ${q.stem}`,'','',true));if(qtype(q)==='mcq')q.ops.forEach((x,j)=>a.push(wp(`${'ABCD'[j]}. ${x}`)));else if(qtype(q)==='tf')q.ops.forEach((x,j)=>a.push(wp(`${'abcd'[j]}) ${x}   [ ] Đúng   [ ] Sai`)));else a.push(wp('Trả lời: ......................................'));if(withAnswers)a.push(wp(`Đáp án: ${qtype(q)==='mcq'?'ABCD'[q.ans]:qtype(q)==='tf'?q.ans.map(x=>x?'Đ':'S').join(','):q.ans}. ${q.exp||''}`))});return a.join('')}
window.edpExamDocx=function(withAnswers=false){if(!examSet.length)return flash('Cần tạo đề trước');docx(`EduPlan_DeHoa${grade}_${withAnswers?'GV_DapAn':'HS'}.docx`,docxExamBody(withAnswers));log('Xuất đề DOCX')};
printExam=function(){if(!examSet.length)return flash('Cần tạo đề');let w=window.open('','_blank');if(!w)return flash('Trình duyệt chặn cửa sổ in');let body=`<h2>ĐỀ LUYỆN TẬP HÓA HỌC ${grade}</h2><p>Họ tên: ........................................ Lớp: ...........</p>`+examSet.map((q,i)=>`<section><p><b>Câu ${i+1}.</b> ${esc(q.stem)}</p>${qtype(q)==='mcq'?q.ops.map((x,j)=>`<p>${'ABCD'[j]}. ${esc(x)}</p>`).join(''):qtype(q)==='tf'?q.ops.map((x,j)=>`<p>${'abcd'[j]}) ${esc(x)} (Đúng / Sai)</p>`).join(''):'<p>Đáp án: _______________________</p>'}</section>`).join('');w.document.write(`<!doctype html><html lang="vi"><meta charset="utf-8"><title>Đề Hóa ${grade}</title><style>body{font-family:'Times New Roman';font-size:13pt;padding:24px;line-height:1.5}h2{text-align:center}section{break-inside:avoid;margin:20px 0}</style>${body}</html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};
window.edpStatsCSV=function(){let at=data.attempts.filter(x=>x.g===grade),head=['Mã người làm','Lớp','Thời điểm','Tỉ lệ phần trăm','Điểm đạt','Tổng điểm'];let rows=[head,...at.map(x=>[x.candidate,x.g,x.time,x.pct,x.correct,x.total])];download(`EduPlan_KetQua_Hoa${grade}.csv`,'\ufeff'+rows.map(r=>r.map(csvV).join(';')).join('\r\n'),'text/csv;charset=utf-8')};

/* Defensive backups: validate core, retain v11 and v12 data, reject untrusted huge payload. */
window.edpBackup=function(){flush();download('EduPlan_1_2_SaoLuu_ToanBo.json',JSON.stringify({format:'eduplan-full-v12',version:'1.2',exported:now(),core:data,planplus:E.getPlus()},null,2),'application/json;charset=utf-8');log('Sao lưu EduPlan 1.2')};
backup=window.edpBackup;
restore=function(ev){let file=ev.target.files?.[0];if(!file)return;if(file.size>5_000_000){flash('Bản sao lưu vượt 5 MB');return}file.text().then(t=>{try{let x=JSON.parse(t),core=x&&['eduplan-full-v12','eduplan-full-v11'].includes(x.format)?x.core:x;if(!core||!Array.isArray(core.questions)||!Array.isArray(core.students)||!Array.isArray(core.attempts)||core.questions.length>10000||core.students.length>500||core.attempts.length>50000)throw Error('Không đúng cấu trúc');if(core.questions.some(q=>typeof q.stem!=='string'||!['10','11','12'].includes(String(q.g))||!validQuestion(q)))throw Error('Có câu hỏi không hợp lệ');if(!confirm('Khôi phục dữ liệu sao lưu? Dữ liệu hiện tại sẽ bị thay thế.'))return;data=core;for(let k of Object.keys(INIT))if(!Array.isArray(data[k]))data[k]=[];if(x?.planplus)E.setPlus(x.planplus);save();E.savePlus();nav('history');flash('Đã khôi phục dữ liệu')}catch(e){flash('Không thể nhập JSON: '+e.message)}finally{ev.target.value=''}})};

 const recent=attempts.slice(0,30).map(x=>`<tr><td>${vEsc(x.candidate||'Mã ẩn danh')}</td><td>${vEsc(x.time)}</td><td>${formatInt(x.correct??0)} / ${formatInt(x.total??0)}</td><td><b>${formatInt(x.pct)}%</b></td></tr>`).join('')||'<tr><td colspan="4">Chưa có lượt làm bài.</td></tr>';
 return page(`Dashboard kết quả Hóa ${grade}`,'Thống kê chính xác theo khối đang chọn; dữ liệu chỉ có trên trình duyệt hiện tại.',`
 <div class="grid four"><div class="card edp13-kpi"><small>Số lượt nộp</small><strong>${attempts.length}</strong></div><div class="card edp13-kpi"><small>Điểm trung bình</small><strong>${formatInt(avg)}%</strong></div><div class="card edp13-kpi"><small>Đạt từ 70%</small><strong>${attempts.filter(a=>Number(a.pct)>=70).length}</strong></div><div class="card edp13-kpi"><small>Chủ đề có kết quả</small><strong>${Object.keys(topics).length}</strong></div></div>
