 <div class="card"><h2>Lưu ý diễn giải</h2><p>Kết quả được tổng hợp từ các lượt nộp trên <b>thiết bị này</b>, không phải báo cáo toàn trường. Mỗi câu đúng/sai được tính tối đa 1 điểm (0,25/ý) trong bản mô phỏng.</p><p class="compact muted">Không dùng để kết luận năng lực học sinh hoặc xếp loại chính thức; cần kiểm tra chất lượng câu hỏi trước khi sử dụng.</p><button class="btn ghost" onclick="window.edpStatsCSV()">Xuất kết quả CSV</button></div></div>

/* Stable quoted multiline CSV parser: UTF-8 BOM, CRLF/LF, escaped double quotes and semicolon/comma. */
function parseCSV13(s){s=String(s||'').replace(/^\uFEFF/,'');if(!s.trim())throw Error('CSV trống.');const first=s.split(/\r?\n/,1)[0],sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],field='',inside=false;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){if(inside&&s[i+1]==='"'){field+='"';i++}else if(inside){inside=false}else if(!field.trim()){inside=true}else{field+=ch}}
 else if(ch===sep&&!inside){row.push(field.trim());field=''}else if((ch==='\r'||ch==='\n')&&!inside){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(field.trim());if(row.some(x=>x))rows.push(row);row=[];field=''}else field+=ch;}
 if(inside)throw Error('Lỗi CSV: thiếu dấu ngoặc kép đóng.');row.push(field.trim());if(row.some(x=>x))rows.push(row);return rows;}
window.edpUploadCSV=async function(ev){const f=ev.target.files?.[0];if(!f)return;try{if(f.size>2_000_000)throw Error('CSV tối đa 2 MB.');const rows=parseCSV13(await f.text());if(!rows.length)throw Error('Không thấy dữ liệu.');const head=rows[0].map(v=>v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));if(head[0].includes('loai')&&head[1]?.includes('ten'))rows.shift();if(!rows.length||rows.length>300)throw Error('CSV cần từ 1 đến 300 dòng dữ liệu.');

 if(document.getElementById('epSchool')){window.EDP.readPlan();window.EDP.savePlus();}window.EDP.getPlan().rows=parsed;window.EDP.savePlus();log('Nhập PPCT '+parsed.length+' dòng CSV phiên bản 1.3');nav('eduplan');flash('Đã nhập CSV '+parsed.length+' dòng.');
 }catch(e){const el=document.getElementById('csvFeedback');if(el)el.innerHTML='<div class="hint warn">'+vEsc(e.message)+'</div>';else flash(e.message)}finally{ev.target.value=''}};

/* JSON bank import, sanitize identifiers and limit size/strings. */
function cleanQuestion(q,index){if(!q||typeof q!=='object')throw Error(`Câu ${index}: không hợp lệ.`);const typ=String(q.type||'mcq').toLowerCase();if(!['mcq','tf','short'].includes(typ))throw Error(`Câu ${index}: loại câu hỏi lạ.`);const stem=String(q.stem||'').trim().slice(0,2000),topic=String(q.topic||'Chủ đề khác').trim().slice(0,160),lv=String(q.lv||'Thông hiểu').trim().slice(0,60);if(!stem)throw Error(`Câu ${index}: thiếu nội dung.`);
 const a={id:'json13_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,8),g:String(grade),type:typ,stem,topic,lv,exp:String(q.exp||'').slice(0,3500)};
 if(typ==='mcq'||typ==='tf'){if(!Array.isArray(q.ops)||q.ops.length!==4)throw Error(`Câu ${index}: cần đúng 4 phương án/nhận định.`);a.ops=q.ops.map(x=>String(x??'').trim().slice(0,1000));if(a.ops.some(x=>!x))throw Error(`Câu ${index}: phương án rỗng.`);if(typ==='mcq'){a.ans=Number(q.ans);if(!Number.isInteger(a.ans)||a.ans<0||a.ans>3)throw Error(`Câu ${index}: đáp án A–D không hợp lệ.`)}else{a.ans=q.ans;if(!Array.isArray(a.ans)||a.ans.length!==4||a.ans.some(v=>typeof v!=='boolean'))throw Error(`Câu ${index}: đáp án đúng/sai phải gồm 4 giá trị boolean.`)}}else{a.ans=String(q.ans??'').trim().slice(0,100);if(!a.ans)throw Error(`Câu ${index}: thiếu đáp án ngắn.`)}return a;}
window.edpImportBank=async function(ev){const file=ev.target.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw Error('Ngân hàng JSON tối đa 2 MB.');const object=JSON.parse(await file.text());const raw=Array.isArray(object)?object:object?.questions;if(!Array.isArray(raw)||!raw.length||raw.length>2000)throw Error('JSON cần mảng 1–2000 câu hỏi.');if(object.grade&&String(object.grade)!==String(grade)&&!confirm(`File thuộc Hóa ${object.grade}; nhập tất cả câu vào Hóa ${grade}?`))return;
 let existing=new Set(data.questions.filter(q=>q.g===grade).map(q=>vNorm(q.stem))),added=[],duplicates=0;raw.forEach((q,i)=>{const candidate=cleanQuestion(q,i+1),key=vNorm(candidate.stem);if(existing.has(key)){duplicates++;return;}existing.add(key);added.push(candidate)});if(!added.length){flash(`Không có câu mới (${duplicates} câu trùng).`);return}if(!confirm(`Nhập ${added.length} câu hợp lệ vào Hóa ${grade}; bỏ qua ${duplicates} câu trùng?`))return;

 }catch(e){flash('Không thể nhập ngân hàng: '+e.message)}finally{ev.target.value=''}};

function buildPrompt(){
 const kind=el('edpAiKind')?.value||'lesson';const t=el('edpAiTopic')?.value||'Hóa học';const g=el('edpAiGrade')?.value||grade;const req=(el('edpAiReq')?.value||'').trim();const text=(el('edpAiContent')?.value||'').trim();
 const specs={
  lesson:'Soạn bản nháp kế hoạch bài dạy với I. Mục tiêu (kiến thức, năng lực, phẩm chất), II. Thiết bị và học liệu, III. Tiến trình 4 hoạt động (mục tiêu, nội dung, sản phẩm, tổ chức), IV. Đánh giá và điều chỉnh. Gợi ý theo tinh thần Phụ lục IV Công văn 5512.',
  worksheet:'Tạo phiếu học tập với mục tiêu, nhiệm vụ, dữ liệu, câu hỏi theo bốn mức nhận biết / thông hiểu / vận dụng / vận dụng cao, ô trả lời và hướng dẫn chấm riêng.',
  questions:'Tạo 6 câu hỏi gồm 2 nhiều lựa chọn bốn phương án, 2 đúng/sai bốn ý, 2 trả lời ngắn, kèm đáp án và giải thích rõ. Không khẳng định đề chính thức của Bộ GDĐT.',
  review:'Phản biện văn bản đã cung cấp: phát hiện và giải thích lỗi công thức, phương trình, trạng thái, hóa trị, số mol, đơn vị, điều kiện phản ứng, đáp án và rủi ro an toàn. Không tự bịa phần thông tin thiếu.'};
 return `Bạn là trợ lý chuyên môn của giáo viên Hóa học THPT Việt Nam. Môn Hóa học lớp ${g}; Chủ đề: ${t}.\nNHIỆM VỤ: ${specs[kind]}.\nYÊU CẦU GIÁO VIÊN: ${req||'Bám sát chương trình GDPT 2018, trình bày sư phạm, vừa đủ chi tiết, phù hợp mức THPT.'}\n${kind==='review'?`VĂN BẢN CẦN RÀ SOÁT:\n${text||'(Chưa cung cấp; hãy yêu cầu dữ liệu trước khi phân tích)'}\n`:''}QUY TẮC: Viết tiếng Việt có cấu trúc rõ, dùng đúng chỉ số dưới/trên cho công thức Hóa học, không bịa dữ liệu/thí nghiệm hoặc dẫn nguồn, giải thích phép tính, nêu điều kiện và lưu ý an toàn. Nếu chưa đủ dữ liệu, hãy ghi rõ điều cần xác minh. Kết thúc bằng danh sách 5 điểm giáo viên cần thẩm định. Đây là bản nháp, không phải hồ sơ được phê duyệt.`;
}
window.edpPreviewPrompt=function(){lastAiPrompt=buildPrompt();const box=el('edpAiPrompt');if(box)box.value=lastAiPrompt;return lastAiPrompt;};
window.edpAiCopyPrompt=async function(){const t=el('edpAiPrompt')?.value||edpPreviewPrompt();try{await navigator.clipboard.writeText(t);flash('Đã sao chép prompt')}catch(e){const b=el('edpAiPrompt');b?.focus();b?.select();flash('Chọn Copy/Ctrl+C để sao chép')}};
window.edpAiGenerate=async function(){
 const btn=el('edpAiRun'),status=el('edpAiStatus'),out=el('edpAiOutput');
 if(!isHosted){status.textContent='Đang mở file cục bộ: không có máy chủ AI. Hãy sao chép prompt và sử dụng ChatGPT/AI Studio.';flash('Bản offline: dùng nút Sao chép prompt');return;}
 const prompt=el('edpAiPrompt')?.value?.trim()||edpPreviewPrompt();
 if(prompt.length>16000){status.textContent='Prompt quá dài; giới hạn 16.000 ký tự.';return;}
 btn.disabled=true;btn.textContent='Đang tạo bản nháp...';status.textContent='Đang yêu cầu máy chủ; vui lòng chờ.';
 try{
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),50000);
  let r;try{r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,task:el('edpAiKind')?.value,grade:grade}),signal:ctrl.signal})}finally{clearTimeout(timer)}
  let res=await r.json().catch(()=>({error:'Dịch vụ không trả về JSON hợp lệ'}));
  if(!r.ok)throw Error(res.error||('Mã '+r.status));
  out.value=String(res.text||'');lastAiResult=out.value;status.textContent='Đã nhận bản nháp. Hãy kiểm tra nội dung chuyên môn trước khi sử dụng.';
 }catch(e){status.textContent='Chưa thể kết nối AI: '+(e.name==='AbortError'?'Hết thời gian chờ':e.message)+'. Bạn vẫn có thể sao chép prompt.';}
 finally{btn.disabled=false;btn.textContent='✦ Tạo với AI';}
};
window.edpAiCopyResult=async function(){const t=el('edpAiOutput')?.value||'';if(!t.trim())return flash('Chưa có nội dung');try{await navigator.clipboard.writeText(t);flash('Đã sao chép nội dung')}catch(e){el('edpAiOutput').select();flash('Bấm Ctrl+C để sao chép')}};
window.edpAiDownload=function(){const txt=el('edpAiOutput')?.value?.trim();if(!txt)return flash('Chưa có nội dung');downloadFile('EduPlan_AI_Ban_nhap_Hoa_'+grade+'.txt',txt);log('Tải bản nháp AI');};

const oldPdfExamPage=pdfExamPage;
pdfExamPage=function(){return oldPdfExamPage()+`<div class="card" style="margin-top:16px"><h2>Đọc PDF có lớp văn bản (khi có Internet)</h2><p>Chọn PDF văn bản thông thường. Kết quả chỉ là bản trích xuất thô; phải kiểm tra lại công thức, chỉ số, hình ảnh và đáp án. <b>PDF scan ảnh chưa được OCR.</b></p><div class="row"><label class="btn ghost">Chọn tệp PDF<input id="edpPdfFile" type="file" accept="application/pdf,.pdf" style="display:none" onchange="edpExtractPdf(this.files[0])"></label><span class="muted" id="edpPdfStatus">Hỗ trợ file dưới 12 MB, tối đa 30 trang.</span></div></div>`};
window.edpExtractPdf=async function(file){
 const status=el('edpPdfStatus');if(!file)return;if(file.size>12*1024*1024){status.textContent='Tệp quá 12 MB, cần giảm kích thước.';return;}
 status.textContent='Đang chuẩn bị trình đọc PDF (cần Internet)...';
 try{

}
function matrix10(){const rows=matrix(),bank=data.questions.filter(x=>String(x.g)===String(grade)&&isValid(x));return one(`Ma trận đề kiểm tra · Hóa ${grade}`,'Thiết kế ma trận gồm chủ đề × mức độ × định dạng. Hệ thống chỉ tạo đề khi ngân hàng có đủ câu phù hợp; không lặng lẽ thay đổi yêu cầu.',`

 ${card('Xây dựng ma trận',`<div class="scroll"><table class="edp10-table"><thead><tr><th>Chủ đề</th><th>Mức độ</th><th>Loại câu</th><th>Số câu</th><th>Có trong ngân hàng</th><th></th></tr></thead><tbody>${rows.map((r,i)=>{const available=bank.filter(q=>q.topic===r.topic&&String(q.lv)===r.level&&getQType(q)===r.type).length;return `<tr><td><select aria-label="Chủ đề dòng ${i+1}" onchange="edp10SetRow(${i},'topic',this.value)">${(topics[grade]||[]).map(t=>`<option ${t===r.topic?'selected':''}>${safe(t)}</option>`).join('')}</select></td><td><select aria-label="Mức độ dòng ${i+1}" onchange="edp10SetRow(${i},'level',this.value)">${lv.map(x=>`<option ${x===r.level?'selected':''}>${safe(x)}</option>`).join('')}</select></td><td><select aria-label="Loại dòng ${i+1}" onchange="edp10SetRow(${i},'type',this.value)">${ty.map(x=>`<option value="${x}" ${x===r.type?'selected':''}>${names[x]}</option>`).join('')}</select></td><td style="width:100px"><input aria-label="Số câu dòng ${i+1}" type="number" min="0" max="80" value="${r.n}" onchange="edp10SetRow(${i},'n',this.value)"></td><td><b class="${available>=r.n?'edp10-good':'edp10-bad'}">${available}</b></td><td><button class="btn ghost mini" onclick="edp10DropRow(${i})" aria-label="Xóa dòng ${i+1}">Xóa</button></td></tr>`}).join('')}</tbody></table></div>

 for(const r of rows){const pool=shuffle(data.questions.filter(q=>String(q.g)===String(grade)&&isValid(q)&&q.topic===r.topic&&String(q.lv)===r.level&&getQType(q)===r.type&&!used.has(String(q.id))));if(pool.length<r.n)issues.push(`Thiếu ${r.n-pool.length} câu: ${r.topic} / ${r.level} / ${names[r.type]}.`);else for(const q of pool.slice(0,r.n)){used.add(String(q.id));const c=structuredClone(q);if(getQType(c)==='mcq'){const order=shuffle([0,1,2,3]);c.ops=order.map(j=>c.ops[j]);c.ans=order.indexOf(Number(q.ans))}out.push(c)}}

function analyzeBank(){const q=data.questions.filter(x=>String(x.g)===String(grade)),issues=[],exact=new Map();let e=0,w=0;

 q.forEach((x,i)=>{if(!isValid(x))mark(i,'Cấu trúc câu hỏi hoặc đáp án không hợp lệ',true);

 if(!lv.includes(String(x.lv)))mark(i,'Mức độ nhận thức chưa chuẩn hóa');
 if((getQType(x)==='mcq'||getQType(x)==='tf')&&Array.isArray(x.ops)){

}

(()=>{

const esc3=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function topic3(){const list=topics[grade]||[];let v=v3.topic[grade];if(v!=='ALL'&&!list.includes(v)){v='ALL';v3.topic[grade]=v}return v}
function shownTopic3(v){return v==='ALL'?'Tất cả chủ đề':v}

function candidate3(){const a=data.attempts.filter(x=>String(x.g)===String(grade));return [...new Set(a.map(x=>String(x.candidate||'KHACH').trim().slice(0,32)).filter(Boolean))].sort()}
function evidence3(candidate,topic){const list=data.attempts.filter(a=>String(a.g)===String(grade)&&String(a.candidate||'KHACH')===candidate);
 const seen=new Set(), details=[]; // newest first; each question ID counts once
 for(const a of list){for(let i=0;i<(Array.isArray(a.detail)?a.detail:[]).length;i++){
   const d=a.detail[i];if(topic!=='ALL'&&d.topic!==topic)continue;
   const id=d.id!==undefined?String(d.id):'legacy:'+String(a.id)+':'+i;
   if(seen.has(id))continue;seen.add(id);
   const cr=Number(d.credit??(d.ok?1:0)); details.push({id,topic:String(d.topic||''),lv:String(d.lv||''),credit:Number.isFinite(cr)?Math.max(0,Math.min(1,cr)):0});
 }}
 const byLevel=LV3.map(lv=>{const rows=details.filter(x=>x.lv===lv);const got=rows.reduce((s,x)=>s+x.credit,0);return {lv,n:rows.length,got,rate:rows.length?got/rows.length*100:null}});
 const rate=details.length?details.reduce((s,x)=>s+x.credit,0)/details.length*100:null;
 const s=v3.settings;let group='unknown';if(details.length>=s.minEvidence)group=rate<s.low?'support':rate<s.high?'progress':'challenge';
 return {candidate,details,byLevel,count:details.length,attempts:list.length,rate,group};
}

 'Vận dụng':['Lựa chọn phương pháp để giải bài toán hoặc tình huống thực tế.','Phân tích dữ kiện, lập phương trình và thực hiện phép tính có đơn vị.','Lời giải theo bước và bước kiểm tra tính hợp lý.'],

  <section class="edp3-hero"><div><div class="edp3-overline">EDUPLAN AI 3.0 · PHÂN HÓA CÓ MINH CHỨNG</div><h2>Không chỉ biết điểm số,<br><span>biết học sinh cần học gì tiếp theo.</span></h2><p>Đối chiếu các câu đã làm theo chủ đề và bốn mức độ; xây dựng nhiệm vụ hỗ trợ phù hợp từ ngân hàng đã kiểm duyệt.</p></div><button class="btn teal" onclick="nav('worksheets3')">Thiết kế phiếu phân hóa →</button></section>
  ${meta3()}
  <div class="card edp3-space"><div class="row between"><h2>Bộ lọc và quy tắc phân nhóm</h2><button class="btn ghost mini" onclick="nav('study10')">Xem lộ trình ôn tập trước đó</button></div>
   <div class="edp3-filter"><label class="field">Chủ đề<select id="edp3Topic" onchange="edp3SetTopic(this.value)">${topicOptions3(tp)}</select></label>

   </div><p class="compact muted">Ngưỡng đang sử dụng: dưới ${v3.settings.low}% → Củng cố; từ ${v3.settings.low}% đến dưới ${v3.settings.high}% → Phát triển; từ ${v3.settings.high}% → Mở rộng. Chỉ phân nhóm khi có từ ${v3.settings.minEvidence} câu khác nhau.</p>
  </div>
  <div class="edp3-four">${[['support','Cần củng cố'],['progress','Đang phát triển'],['challenge','Sẵn sàng mở rộng'],['unknown','Chưa đủ dữ liệu']].map(([k,t])=>`<div class="edp3-metric edp3-${k}"><strong>${counts[k]}</strong><span>${t}</span></div>`).join('')}</div>
  <div class="edp3-two"><div class="card"><div class="row between"><h2>Hồ sơ theo mã học sinh</h2><button class="btn ghost mini" onclick="edp3ExportGroup()">Xuất CSV nhóm</button></div>${!a.length?'<div class="empty">Chưa có bài làm được ghi nhận cho khối này. Hãy tạo bài chẩn đoán hoặc luyện tập trước.</div>':`<div class="scroll"><table class="simpleTable"><thead><tr><th>Mã</th><th>Câu khác nhau</th><th>Tỷ lệ đúng quy đổi</th><th>Gợi ý hỗ trợ</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc3(x.candidate)}</b></td><td>${x.count}</td><td>${x.rate===null?'—':x.rate.toFixed(1)+'%'}</td><td>${labelGroup3(x.group)}</td></tr>`).join('')}</tbody></table></div>`}</div>
  <div class="card"><h2>Phân tích chi tiết theo bốn mức độ</h2>${!one?'<div class="empty">Chưa có dữ liệu học sinh. Không tự suy đoán năng lực khi chưa khảo sát.</div>':`<label class="field"><span>Mã đang xem</span><select id="edp3Student" onchange="edp3Choose(this.value)">${options}</select></label><p>Nhóm hỗ trợ: ${labelGroup3(one.group)} · ${one.count} câu khác nhau; ${one.attempts} lượt làm bài.</p><div class="edp3-levelrows">${one.byLevel.map(x=>`<div class="edp3-levelrow">${levelBadge3(x.lv)}<div class="edp3-progress"><div style="width:${x.rate||0}%"></div></div><b>${x.rate===null?'Chưa có':x.rate.toFixed(0)+'%'}</b><small>${x.n} câu</small></div>`).join('')}</div><p class="compact muted">Các mức độ chưa có câu được ghi “Chưa có”; không thể suy ra trình độ ở mức đó.</p>`}<div class="row"><button class="btn teal" onclick="edp3Diagnostic()">Tạo bài chẩn đoán 4 mức</button><button class="btn ghost" onclick="nav('worksheets3')">Giao nhiệm vụ phân hóa</button></div><div id="edp3DiagResult" aria-live="polite"></div></div></div>
  <div class="card edp3-space"><h2>Hướng can thiệp sư phạm</h2><div class="edp3-three">${[['support','Củng cố nền tảng','Tập trung Nhận biết → Thông hiểu. Thêm ví dụ mẫu, gợi ý có kiểm soát, phản hồi ngay.'],['progress','Phát triển kiến thức','Củng cố Thông hiểu → Vận dụng. Bài toán thay đổi dữ kiện, khuyến khích tự giải thích.'],['challenge','Thử thách nâng cao','Ưu tiên Vận dụng → Vận dụng cao. Giao tình huống thực tế nhiều bước và nhiệm vụ phản biện.']].map(([k,t,d])=>`<div class="edp3-tier edp3-${k}"><h3>${t}</h3><p>${d}</p><button class="btn ghost mini" onclick="edp3GoPack('${k}')">Thiết kế phiếu nhóm này →</button></div>`).join('')}</div></div>`);
}
window.edp3SetTopic=x=>{if(x!=='ALL'&&!(topics[grade]||[]).includes(x))return;v3.topic[grade]=x;persist3();nav('differentiate3')};
window.edp3SetConfig=(k,x)=>{let n=Number(x);if(!Number.isInteger(n))return flash('Nhập giá trị nguyên hợp lệ');if(k==='minEvidence'){if(n<2||n>15)return flash('Số câu tối thiểu từ 2 đến 15')}else if(k==='low'){if(n<30||n>70||n>=v3.settings.high)return flash('Ngưỡng củng cố: 30–70%, thấp hơn ngưỡng mở rộng')}else if(k==='high'){if(n<70||n>95||n<=v3.settings.low)return flash('Ngưỡng mở rộng: 70–95%, cao hơn ngưỡng củng cố')}else return;v3.settings[k]=n;persist3();nav('differentiate3')};

window.edp3ExportGroup=()=>{const t=topic3(),rows=[['Khối','Chủ đề','Mã ẩn danh','Số câu khác nhau','Số lượt bài','Tỷ lệ đúng quy đổi (%)','Nhóm hỗ trợ'],...allEvidence3(t).map(x=>[grade,shownTopic3(t),x.candidate,x.count,x.attempts,x.rate===null?'':x.rate.toFixed(1),gNames3[x.group]])];dlCsv3('EduPlan3_PhanHoa_Hoa'+grade+'.csv',rows)};
window.edp3Diagnostic=()=>{const tp=topic3(),miss=[],chosen=[];
 for(const lv of LV3){const pool=shuffle(data.questions.filter(q=>String(q.g)===String(grade)&&(tp==='ALL'||q.topic===tp)&&String(q.lv)===lv&&isQuestion3(q)));if(!pool.length)miss.push(lv);else chosen.push(clone3(pool[0]))}
 if(miss.length){const div=get3('edp3DiagResult');if(div)div.innerHTML=`<div class="edp3-alert"><b>Chưa tạo bài chẩn đoán.</b> Ngân hàng còn thiếu câu ở mức: ${miss.map(esc3).join(', ')}. Hãy thêm câu đúng chủ đề / mức độ.</div>`;return}
 startExam3(chosen);flash('Đã chuẩn bị bài chẩn đoán gồm 4 câu ở 4 mức độ. Giáo viên kiểm duyệt trước khi dùng.')};
function isQuestion3(q){if(!q||!String(q.stem||'').trim())return false;const t=q.type||'mcq';if(t==='tf')return Array.isArray(q.ops)&&q.ops.length===4&&Array.isArray(q.ans)&&q.ans.length===4&&q.ans.every(x=>typeof x==='boolean');if(t==='short')return String(q.ans??'').trim().length>0;return Array.isArray(q.ops)&&q.ops.length===4&&Number.isInteger(Number(q.ans))&&Number(q.ans)>=0&&Number(q.ans)<=3;}
function startExam3(selected){examSet=shuffle(selected.map(clone3));for(const q of examSet){if((q.type||'mcq')==='mcq'){const order=shuffle([0,1,2,3]);let ops=q.ops.slice();q.ops=order.map(i=>ops[i]);q.ans=order.indexOf(Number(q.ans));}}
 nav('exam');let zone=get3('examZone');if(zone){zone.innerHTML=examHTML();zone.scrollIntoView({behavior:'smooth',block:'start'});}let cand=v3.selected[grade];if(cand&&get3('candidate'))get3('candidate').value=cand;}
window.edp3GoPack=k=>{v3.pack[grade]=Object.assign({},v3.pack[grade]||{},{group:k});persist3();nav('worksheets3')};
function pack3(){return v3.pack[grade]||(v3.pack[grade]={topic:'ALL',group:'all',n:1})}

 const opts=[['all','Bốn mức độ'],['support','Củng cố nền tảng'],['progress','Phát triển kiến thức'],['challenge','Thử thách nâng cao']];
 const allQ=data.questions.filter(q=>String(q.g)===String(grade)&&(t==='ALL'||q.topic===t)&&isQuestion3(q));
 const lvCounts=LV3.map(l=>[l,allQ.filter(q=>q.lv===l).length]);
 return page('Phiếu học tập phân hóa · Hóa '+grade,'Tạo phiếu bằng câu hỏi có thật trong ngân hàng; chọn nhóm và mức độ, kèm giàn giáo sư phạm. Không tự sinh câu mới hay tự bịa đáp án.',`
 <section class="edp3-hero"><div><div class="edp3-overline">BỘ CÔNG CỤ THIẾT KẾ HỌC LIỆU</div><h2>Một chủ đề – nhiều đường học.</h2><p>Thiết kế nhiệm vụ theo Nhận biết, Thông hiểu, Vận dụng, Vận dụng cao; điều chỉnh gợi ý cho từng nhóm học sinh.</p></div><button class="btn ghost" onclick="nav('differentiate3')">← Xem phân tích học sinh</button></section>

 <div class="card"><h2>Độ phủ câu hỏi theo mức độ</h2><p class="compact muted">Chủ đề: ${esc3(shownTopic3(t))} · Ngân hàng ${allQ.length} câu</p><div class="edp3-levelrows">${lvCounts.map(([l,n])=>`<div class="edp3-levelrow">${levelBadge3(l)}<div class="edp3-progress"><div style="width:${Math.min(100,n*22)}%"></div></div><b>${n}</b><small>câu</small></div>`).join('')}</div><div class="edp3-caution"><b>Gợi ý:</b> Câu hỏi phải có lời giải chính xác do giáo viên kiểm duyệt. Các mức chưa có câu cần bổ sung thay vì dùng câu sai mức hoặc sao chép câu trùng.</div></div></div>

}
window.edp3PackSet=(k,v)=>{let p=pack3();if(k==='n'){const n=Number(v);if(!Number.isInteger(n)||n<1||n>6)return flash('Chọn 1–6 câu mỗi mức độ');p.n=n}else if(k==='group'){if(!['all','support','progress','challenge'].includes(v))return;p.group=v}else if(k==='topic'){if(v!=='ALL'&&!(topics[grade]||[]).includes(v))return;p.topic=v}else return;packPreview=null;persist3();nav('worksheets3')};

function evidenceAudit31(candidate,topic){
  const attempts=data.attempts.filter(a=>String(a.g)===String(grade)&&String(a.candidate||'KHACH')===String(candidate));
  const sorted=attempts.map((a,i)=>({a,i})).sort((x,y)=>{
    const dx=Number(y.a.id),dy=Number(x.a.id);
    return Number.isFinite(dx)&&Number.isFinite(dy)&&dx!==dy?dx-dy:x.i-y.i;
  }).map(x=>x.a);
  const attemptCount=new Set(sorted.map(a=>String(a.id??a.time??'')).filter(Boolean)).size;
  const seen=new Set(),details=[];let invalid=0,repeated=0,reported=0;
  const bank=new Map(data.questions.filter(q=>String(q.g)===String(grade)).map(q=>[String(q.id),q]));
  let missingBank=0;
  for(const a of sorted){const rows=Array.isArray(a.detail)?a.detail:[];
    for(let j=0;j<rows.length;j++){
      const d=rows[j];if(!d||typeof d!=='object'){invalid++;continue;}
      if(topic!=='ALL'&&String(d.topic)!==topic)continue;
      reported++;
      const id=d.id===undefined||d.id===null?'':String(d.id).trim();
      if(!id||!LV3.includes(String(d.lv||''))||!String(d.topic||'').trim()) {invalid++;continue;}
      const key=grade+'|'+id;
      if(seen.has(key)){repeated++;continue;}seen.add(key);
      const val=d.credit===undefined?(d.ok===true?1:d.ok===false?0:NaN):Number(d.credit);
      if(!Number.isFinite(val)||val<0||val>1){invalid++;continue;}
      // Earlier attempts remain as historical snapshots if question was removed from bank.
      if(!bank.has(id))missingBank++;
      details.push({id,topic:String(d.topic),lv:String(d.lv),credit:val});
    }
  }
  const byLevel=LV3.map(lv=>{const rows=details.filter(x=>x.lv===lv),got=rows.reduce((s,x)=>s+x.credit,0);return{lv,n:rows.length,got,rate:rows.length?100*got/rows.length:null}});
  const topicList=[...new Set(details.map(x=>x.topic))];
  const count=details.length, levelsCovered=byLevel.filter(x=>x.n>=qa31.perLevel).length;
  const rate=count?100*details.reduce((s,x)=>s+x.credit,0)/count:null;
  const invalidShare=reported?invalid/reported:0, repeatShare=reported?repeated/reported:0;
  const problems=[];
  const minN=Math.max(qa31.minItems,Number(v3.settings.minEvidence)||qa31.minItems);
  if(count<minN)problems.push(`Cần ít nhất ${minN} câu khác nhau (${count}/${minN})`);
  if(levelsCovered<qa31.minLevels)problems.push('Cần tối thiểu 2 mức độ, mỗi mức từ 2 câu');
  if(topic==='ALL'&&topicList.length<2)problems.push('Đang xem tất cả: cần ít nhất 2 chủ đề khác nhau');
  if(attemptCount<qa31.minAttempts)problems.push('Cần từ 2 lần đánh giá để hạn chế lệ thuộc một bài');
  if(invalid)problems.push(`${invalid} lượt câu thiếu hoặc sai dữ liệu`);
  if(repeated)problems.push(`${repeated} lượt làm lại đã loại khỏi tỷ lệ`);
  if(missingBank)problems.push(`${missingBank} câu không còn đối chiếu được với ngân hàng hiện tại`);
  const eligible=count>=minN&&levelsCovered>=qa31.minLevels&&
    (topic!=='ALL'||topicList.length>=2)&&attemptCount>=qa31.minAttempts&&invalidShare<=.1&&missingBank===0&&repeatShare<=.4;
  const strong=eligible&&count>=qa31.strongItems&&levelsCovered>=qa31.strongLevels&&attemptCount>=3&&invalid===0&&missingBank===0;
  const quality=strong?'strong':eligible?'moderate':'weak';
  const s=v3.settings;
  const group=eligible?(rate<s.low?'support':rate<s.high?'progress':'challenge'):'unknown';
  const focus=byLevel.filter(x=>x.n>=qa31.perLevel).sort((a,b)=>a.rate-b.rate)[0]||null;
  return {candidate,details,byLevel,count,attempts:attemptCount,rate,group,quality,problems,topicCount:topicList.length,
    levelsCovered,invalid,repeated,reported,repeatShare,missingBank,focus,eligible,score:Math.min(100,Math.round(
       30*Math.min(1,count/16)+25*(levelsCovered/4)+15*Math.min(1,attemptCount/3)+
       15*(topic==='ALL'?Math.min(1,topicList.length/2):1)+15*(1-Math.min(1,invalidShare+repeatShare))))};
}

 }

 const wp=window.edp31Docx.wp;const parts=[wp('EDUPLAN AI — TÀI LIỆU HÓA HỌC '+grade,'Title','center'),wp('Tác giả giải pháp: Lê Bá Nhẫn – Trường THPT Hòn Đất'),wp('Tài liệu tham khảo - câu hỏi do EduPlan AI biên soạn mới; giáo viên kiểm định trước khi phát hành.')];
 let no=0;
 for(const type of kinds32){const qs=list.filter(q=>q.type===type);if(!qs.length)continue;
 parts.push(wp(labels32[type],'Heading1'));
 for(const q of qs){parts.push(wp('Câu '+(++no)+' ('+q.lv+'). '+q.stem));
   if(type==='mcq')q.ops.forEach((s,j)=>parts.push(wp('ABCD'[j]+'. '+s)));
   if(type==='tf')q.ops.forEach((s,j)=>parts.push(wp('abcd'[j]+') '+s+' [ ] Đúng  [ ] Sai')));
   if(type==='short')parts.push(wp('Trả lời: ................................................'));
   if(type==='essay')parts.push(wp('Bài làm: ........................................................................'));
   if(teacher){const ans=type==='mcq'?'ABCD'[q.ans]:type==='tf'?q.ans.map(x=>x?'Đ':'S').join(', '):String(q.ans);
      parts.push(wp('Đáp án/Hướng dẫn: '+ans));parts.push(wp('Giải thích: '+q.exp));if(type==='essay')q.rubric.forEach((x,i)=>parts.push(wp('Tiêu chí '+(i+1)+': '+x)));}
 }
 }
 window.edp31Docx.docx(`EduPlan_AI_Hoa${grade}_4Phan_${teacher?'GV_DapAn':'HS_TuLuyen'}.docx`,parts.join(''));
};
window.edp32ExportJson=function(){const bank=filtered32(),txt=JSON.stringify({format:'eduplan-curated-v32',author:'Lê Bá Nhẫn – Trường THPT Hòn Đất',grade,questions:bank,notice:'32 bài mẫu; tự biên soạn, đối chiếu tham khảo, cần GV thẩm định'},null,2);const blob=new Blob([txt],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`EduPlan_Hoa${grade}_ThuVien_4Phan.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};

 ${STATE32.view==='bank'?`<div class="e32-panel"><div class="row between"><div><h2>Ngân hàng câu hỏi bốn phần</h2><p>Hiện ${filtered.length} câu, giáo viên tự thẩm định trước sử dụng.</p></div><div class="row"><button class="btn teal" onclick="edp32MakeQuiz()">Tạo bài luyện tập theo bộ lọc</button></div></div><div class="row"><button class="btn ghost" onclick="edp32Export(false)">Xuất Word học sinh</button><button class="btn ghost" onclick="edp32Export(true)">Xuất Word giáo viên + lời giải</button><button class="btn ghost" onclick="edp32ExportJson()">Xuất JSON</button></div></div>

 <div class="e32-panel"><h2>Danh mục câu hỏi</h2>${kinds32.map(k=>{const qs=filtered.filter(q=>q.type===k);return qs.length?`<section><h3>${esc32(labels32[k])} (${qs.length})</h3>${qs.map((q,i)=>`<details class="e32-item"><summary><b>${i+1}.</b> ${esc32(q.stem)} <small>${esc32(q.lv)} · ${esc32(q.lesson)}</small></summary><div class="e32-open">${q.type==='mcq'?q.ops.map((s,j)=>`<p>${'ABCD'[j]}. ${esc32(s)}</p>`).join(''):q.type==='tf'?q.ops.map((s,j)=>`<p>${'abcd'[j]}) ${esc32(s)}</p>`).join(''):''}<details><summary>Hiện đáp án, giải thích và rubric</summary><p><b>Đáp án:</b> ${esc32(q.type==='mcq'?'ABCD'[q.ans]:q.type==='tf'?q.ans.map(x=>x?'Đ':'S').join(', '):q.ans)}</p><p>${esc32(q.exp)}</p>${q.type==='essay'?`<ul>${q.rubric.map(x=>`<li>${esc32(x)}</li>`).join('')}</ul>`:''}</details></div></details>`).join('')}</section>`:''}).join('')}</div></div>`:''}
 ${STATE32.view==='sources'?`<div class="e32-panel"><h2>Tài liệu đối chiếu và phạm vi</h2><p>Câu hỏi trong bộ này là câu mới do EduPlan AI biên soạn dựa trên kiến thức cơ sở và khung chương trình; không lấy nguyên văn từ các trang nguồn. Không tuyên bố đã bao phủ toàn bộ SGK lớp 10–12.</p><ul>${SOURCE32.map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${esc32(s.url)}">${esc32(s.title)}</a></li>`).join('')}</ul><div class="e32-warning"><b>Về cấu trúc:</b> Phần I–III là ba dạng câu hỏi khách quan theo cấu trúc thi từ năm 2025. Phần IV là tự luận tăng cường của EduPlan AI dành cho học trên lớp và luyện nâng cao, không phải một phần bắt buộc của đề tốt nghiệp THPT.</div><p><b>Độ tin cậy:</b> đã kiểm tra cấu trúc ngân hàng, không trùng chính xác và đã rà soát thủ công các phép tính mẫu. Giáo viên vẫn cần thẩm định trước phát hành.</p></div>`:''}
