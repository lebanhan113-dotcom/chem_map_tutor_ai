function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function toast(msg){const node=document.getElementById('notice');if(node){node.textContent=msg;node.style.display='block';node.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function level(l){return {NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng',VDC:'Vận dụng cao'}[l]||l}
function quota(total,percent){const levels=['NB','TH','VD','VDC'], raw=levels.map(k=>total*(percent[k]||0)/100),out=raw.map(Math.floor);let left=total-out.reduce((a,b)=>a+b,0);const order=levels.map((_,i)=>i).sort((a,b)=>raw[b]%1-raw[a]%1||a-b);for(let i=0;i<left;i++)out[order[i]]++;return Object.fromEntries(levels.map((k,i)=>[k,out[i]]))}
function shuffle(arr){const out=arr.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}

function heading(title,subtitle){return `<h1 class="heading">${esc(title)}</h1><p class="muted">${esc(subtitle)}</p>`}
function home(){const drafts=state.bank.filter(x=>x.verified).length;return `<div class="hero"><div><span class="pill">WEBAPP HÓA HỌC THPT • V5.5</span><h1>Giảng dạy khoa học, đánh giá thông minh.</h1><p>Một không gian chung để xây dựng ma trận đề, phân hóa câu hỏi, làm bài và phân tích lỗi sai của học sinh Hóa 10–11–12.</p></div><div class="hero-art">⚛</div></div><div class="metrics"><div class="metric"><small>Câu hỏi minh họa</small><strong>${drafts}</strong><span>Ngân hàng tại trình duyệt này</span></div><div class="metric"><small>Đề đã tạo</small><strong>${state.exams.length}</strong><span>Trộn câu và phương án</span></div><div class="metric"><small>Lượt mở ở trình duyệt này</small><strong>${state.visits}</strong><span>Không phải truy cập website online</span></div><div class="metric"><small>Bài nộp thử</small><strong>${state.attempts.length}</strong><span>Điểm tối đa 10</span></div></div><h3>Truy cập nhanh</h3><div class="cards">${card('Tạo & trộn đề kiểm tra','Ma trận 4 mức độ và nhiều mã đề','▤','create')}${card('Kiểm tra trực tuyến','Làm bài, nộp bài, xem đáp án','✎','test')}${card('Kết quả & phân tích','Báo cáo điểm và lỗi sai','▥','results')}${card('Trợ lý AI Hóa học','Tính năng online trong bộ triển khai','✧','ai')}${card('Học liệu tham khảo','PhET, PubChem, IUPAC và học liệu mở','▣','docs')}${card('Luyện tập tương tác','Câu hỏi tự luyện với phản hồi','★','practice')}</div>`}
function bank(){const rows=state.bank.filter(q=>q.grade===state.grade);return `${heading('Ngân hàng câu hỏi Hóa học','Dữ liệu minh họa có lời giải và phân loại từng mức độ; bản online có nhập JSON, duyệt câu và AI bổ sung.') }<div class="panel"><div class="row"><label class="field">Khối<select onchange="setGrade(this.value)">${[10,11,12].map(g=>`<option ${g===state.grade?'selected':''}>${g}</option>`).join('')}</select></label><button class="btn secondary" onclick="downloadBank()">↓ Sao lưu JSON</button><span class="pill ok">${rows.length} câu ở khối ${state.grade}</span></div></div>${rows.map((q,i)=>`<div class="q"><span class="pill">${level(q.difficulty)}</span><small> ${esc(q.chapter)} · ${esc(q.lesson)}</small><h4>Câu ${i+1}. ${esc(q.stem)}</h4><div class="two">${Object.entries(q.options||{}).map(([k,v])=>`<small><b>${k}.</b> ${esc(v)}</small>`).join('')}</div><p class="muted"><b>Đáp án: ${esc(q.answer)}</b> · ${esc(q.explanation)}</p></div>`).join('')}`}
function downloadBank(){const b=new Blob([JSON.stringify(state.bank,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='EduPlan_AI_5_5_Demo_Bank.json';a.click();URL.revokeObjectURL(a.href)}
function create(){return `${heading('Tạo và trộn đề kiểm tra','Bộ tạo mã đề minh họa: trộn câu hỏi và đảo lựa chọn, luôn kiểm tra đủ ma trận.') }<div class="panel"><div class="row"><label class="field">Khối lớp<select id="gr" onchange="setGrade(this.value)">${[10,11,12].map(g=>`<option ${g===state.grade?'selected':''}>Hóa ${g}</option>`.replace(`Hóa ${g}`,g)).join('')}</select></label><label class="field">Loại đề<select id="kind"><option>Kiểm tra theo bài</option><option>Kiểm tra theo chương</option><option>Kiểm tra thường xuyên</option><option>Giữa học kì I</option><option>Giữa học kì II</option></select></label><label class="field">Số câu<input id="amount" type="number" min="1" max="40" value="4" oninput="drawMatrix()"/></label><label class="field">Số mã đề<input id="variants" type="number" min="1" max="6" value="2"/></label></div><label class="field">Tên đề<input id="exam-title" value="Kiểm tra Hóa học ${state.grade}"/></label><div class="matrixbox"><h3>Ma trận phân hóa tự động</h3><div class="grid4">${['NB','TH','VD','VDC'].map((k,i)=>`<div class="mcell"><b>${level(k)}</b><label class="field">Tỉ lệ (%)<input type="number" min="0" max="100" id="pct-${k}" value="${[30,40,20,10][i]}" oninput="drawMatrix()"/></label><strong id="quota-${k}">–</strong><small id="available-${k}"></small></div>`).join('')}</div><div id="matrixWarn" class="aside-note"></div></div><div class="row"><button class="btn" onclick="generateExam()">▤ Tạo & trộn đề</button><span class="muted">Không thể phát hành nếu thiếu câu theo mức độ</span></div></div><div class="panel"><h3>Đề đã tạo trong phiên thử</h3>${state.exams.length?`<div class="tablewrap"><table><tr><th>Mã đề</th><th>Tên đề</th><th>Khối</th><th>Số câu</th><th>Hành động</th></tr>${state.exams.map(t=>`<tr><td><b>${t.code}</b></td><td>${esc(t.title)}</td><td>${t.grade}</td><td>${t.ids.length}</td><td><button class="btn secondary" onclick="openTest('${t.code}')">Mở làm thử</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có đề. Bấm Tạo & trộn đề sau khi chọn ma trận phù hợp.</p>'}</div>`}
function drawMatrix(){const el=document.getElementById('amount');if(!el)return;const count=Number(el.value)||4,p=Object.fromEntries(['NB','TH','VD','VDC'].map(k=>[k,Math.max(0,Number(document.getElementById('pct-'+k)?.value)||0)]));let total=Object.values(p).reduce((a,b)=>a+b,0),q=quota(Math.max(1,count),p);let warnings=[];for(const k of Object.keys(p)){const n=state.bank.filter(x=>x.grade===state.grade&&x.difficulty===k).length;document.getElementById('quota-'+k).textContent=q[k]+' câu';document.getElementById('available-'+k).textContent='Có '+n+' câu minh họa';if(q[k]>n)warnings.push(level(k)+' thiếu '+(q[k]-n));}document.getElementById('matrixWarn').textContent='Tổng tỉ lệ: '+total+'%.'+(warnings.length?' Thiếu: '+warnings.join('; '):' Đủ câu để thử theo ma trận.')}
function generateExam(){const count=Math.max(1,Math.min(40,Number(document.getElementById('amount').value)||4)),pct=Object.fromEntries(['NB','TH','VD','VDC'].map(k=>[k,Number(document.getElementById('pct-'+k).value)||0]));if(Object.values(pct).reduce((a,b)=>a+b,0)!==100){toast('Tổng tỉ lệ ma trận phải bằng 100%.');return}const q=quota(count,pct),all=state.bank.filter(x=>x.grade===state.grade),chosen=[];for(const level of ['NB','TH','VD','VDC']){const got=shuffle(all.filter(x=>x.difficulty===level)).slice(0,q[level]);if(got.length<q[level]){toast(`Thiếu câu ${level}: cần ${q[level]}, mới có ${got.length}. Bản online sẽ tạo câu nháp AI để giáo viên duyệt.`);return}chosen.push(...got)}const n=Math.min(6,Math.max(1,Number(document.getElementById('variants').value)||1)), title=document.getElementById('exam-title').value.trim()||'Bài kiểm tra';for(let v=0;v<n;v++){const code=('DEMO'+Math.random().toString(36).slice(2,8)).toUpperCase();state.exams.push({code,grade:state.grade,title,kind:document.getElementById('kind').value,ids:shuffle(chosen.map(q=>q.id)),orders:Object.fromEntries(chosen.map(q=>[q.id,shuffle(['A','B','C','D'])]))})}persist();render();toast('Đã tạo '+n+' mã đề. Có thể chuyển vai trò Học sinh để làm thử.');}
function getTest(code){return state.exams.find(x=>x.code===code)}
function displayQ(q,t){const orders=t.orders[q.id];return {...q,options:Object.fromEntries(['A','B','C','D'].map((letter,i)=>[letter,q.options[orders[i]]])),correct:['A','B','C','D'][orders.indexOf(q.answer)]}}
function openTest(code){const t=getTest(String(code).toUpperCase());if(!t){toast('Mã đề không tồn tại trên trình duyệt này.');return}currentExam=t;currentAnswers={};testResult=null;state.tab='test';persist();render()}
function answer(id,v){currentAnswers[id]=v;const x=document.getElementById('counter');if(x)x.textContent=Object.keys(currentAnswers).length+'/'+currentExam.ids.length+' câu đã trả lời'}
function submitTest(){if(!currentExam)return;const t=currentExam,details=t.ids.map(id=>{const q=displayQ(state.bank.find(q=>q.id===id),t),given=currentAnswers[id]||'',correct=given===q.correct;return {...q,given,answerLabel:q.correct,correct}}),score=Math.round(details.filter(x=>x.correct).length*1000/details.length)/100;testResult={code:t.code,title:t.title,details,score,date:new Date().toLocaleString('vi-VN')};state.attempts.push({...testResult,role:'student-demo'});persist();currentExam=null;render()}
function testView(){if(testResult){let r=testResult;return `${heading('Kết quả bài kiểm tra','Hiển thị đầy đủ câu hỏi, câu em đã chọn, đáp án và lời giải.') }<div class="panel"><span class="pill ok">ĐÃ NỘP BÀI – DEMO</span><h2>${esc(r.title)}</h2><div class="score">${r.score}<small>/10</small></div><p>Đúng ${r.details.filter(x=>x.correct).length}/${r.details.length} câu</p>${r.details.map((q,i)=>`<div class="resultitem"><span class="pill ${q.correct?'ok':'warn'}">Câu ${i+1} · ${q.correct?'Đúng':'Cần ôn lại'}</span><h4>${esc(q.stem)}</h4><div class="two">${Object.entries(q.options).map(([k,v])=>`<small>${k}. ${esc(v)}</small>`).join('')}</div><p><b>Em chọn:</b> ${esc(q.given||'Chưa trả lời')} · <b>Đáp án:</b> ${esc(q.answerLabel)}</p><p><b>Giải thích:</b> ${esc(q.explanation)}</p></div>`).join('')}</div>`}
if(currentExam){const t=currentExam;return `${heading('Làm bài kiểm tra online','Chế độ demo lưu bài làm trong trình duyệt; đề thật có kiểm soát thời gian từ máy chủ.') }<div class="panel"><span class="pill">${esc(t.kind)}</span><h3>${esc(t.title)} · Mã ${esc(t.code)}</h3><p id="counter" class="muted">0/${t.ids.length} câu đã trả lời</p>${t.ids.map((id,i)=>{const q=displayQ(state.bank.find(q=>q.id===id),t);return `<div class="q"><span class="pill">Câu ${i+1} · ${level(q.difficulty)}</span><h4>${esc(q.stem)}</h4><div class="opts">${Object.entries(q.options).map(([k,v])=>`<label class="opt"><input type="radio" name="${id}" onchange="answer('${id}','${k}')"><b>${k}.</b> ${esc(v)}</label>`).join('')}</div></div>`}).join('')}<button class="btn" onclick="submitTest()">Nộp bài và nhận điểm /10</button></div>`}
return `${heading('Làm bài kiểm tra','Nhập mã đề đã tạo ở khu vực Giáo viên để thử chấm điểm.') }<div class="panel"><div class="row"><label class="field">Mã đề<input id="code" placeholder="DEMO..." value="${state.exams.length?state.exams.at(-1).code:''}"/></label><button class="btn" onclick="openTest(document.getElementById('code').value)">Bắt đầu làm bài</button></div><p class="muted">Bản demo hoạt động tại chỗ. Bộ Next.js kèm theo mới là mã nguồn chạy online trên Supabase.</p></div>`}
function results(){const attempts=state.attempts;let avg=attempts.length?Math.round(attempts.reduce((s,a)=>s+a.score,0)/attempts.length*100)/100:0;return `${heading('Kết quả kiểm tra & học tập','Thống kê từ lượt làm thử trên chính trình duyệt này. Số người dùng online chỉ có trên bản đã cấu hình Supabase.') }<div class="metrics"><div class="metric"><small>Lượt mở demo</small><strong>${state.visits}</strong><span>LocalStorage trên máy này</span></div><div class="metric"><small>Bài đã nộp thử</small><strong>${attempts.length}</strong></div><div class="metric"><small>Điểm trung bình</small><strong>${avg}</strong><span>/10</span></div><div class="metric"><small>Mã đề đã tạo</small><strong>${state.exams.length}</strong></div></div><div class="panel"><h3>Chi tiết bài làm</h3><div class="tablewrap"><table><tr><th>Mã đề</th><th>Bài kiểm tra</th><th>Điểm</th><th>Số đúng</th><th>Ngày nộp</th></tr>${attempts.map(x=>`<tr><td>${x.code}</td><td>${esc(x.title)}</td><td><b>${x.score}/10</b></td><td>${x.details.filter(q=>q.correct).length}/${x.details.length}</td><td>${esc(x.date)}</td></tr>`).join('')}</table></div>${!attempts.length?'<p class="muted">Chưa có bài nộp thử.</p>':''}</div>`}
function ai(){return `${heading('Trợ lý AI và giải bài tập Hóa học','AI được gọi qua API máy chủ ở bản online; bản HTML không chứa khóa API để đảm bảo an toàn.') }<div class="panel"><label class="field">Nhập bài tập hoặc câu hỏi<textarea id="ask" placeholder="Ví dụ: Phân tích sai lầm khi tính pH của dung dịch HCl 0,01 M..."></textarea></label><div class="row"><button class="btn" onclick="makePrompt()">Tạo câu lệnh để dùng với AI</button><a href="https://chatgpt.com/" target="_blank" rel="noreferrer" class="btn secondary">Mở ChatGPT ↗</a></div><div id="promptResult"></div></div><div class="notice warning">Đây là bản dùng thử không kết nối Gemini. Hệ thống triển khai Next.js có trợ lý AI qua GEMINI_API_KEY đặt tại máy chủ. Câu trả lời của AI cần giáo viên kiểm tra.</div>`}
function makePrompt(){const x=document.getElementById('ask').value.trim();if(!x){toast('Hãy nhập bài tập trước.');return}const prompt='Đóng vai giáo viên Hóa học THPT, giải bài theo từng bước, có phương trình cân bằng, đơn vị đúng, chỉ ra lỗi sai thường gặp và ghi nhớ ngắn gọn. Bài tập: '+x;const node=document.getElementById('promptResult');node.innerHTML='<pre style="white-space:pre-wrap;background:#f4f9fd;padding:14px;border-radius:10px;line-height:1.7;font-size:12px">'+esc(prompt)+'</pre>';navigator.clipboard?.writeText(prompt).then(()=>toast('Đã sao chép câu lệnh.'),()=>{});}
function practice(){const rows=shuffle(state.bank.filter(q=>q.grade===state.grade)).slice(0,4);return `${heading('Bài tập tương tác tự luyện','Luyện tập mẫu, sau mỗi câu nhận lời giải. Không tính vào điểm kiểm tra.') }<div class="panel"><div class="row"><label class="field">Khối lớp<select onchange="setGrade(this.value)">${[10,11,12].map(x=>`<option value="${x}" ${x===state.grade?'selected':''}>Hóa ${x}</option>`).join('')}</select></label></div>${rows.map((q,i)=>`<div class="q"><span class="pill">${level(q.difficulty)}</span><h4>Câu ${i+1}. ${esc(q.stem)}</h4><div class="opts">${Object.entries(q.options).map(([k,v])=>`<button class="btn secondary" style="text-align:left" onclick="practiceFeedback(this,${Number(k===q.answer)},'${esc(q.answer)}',${i})">${k}. ${esc(v)}</button>`).join('')}</div><div id="pf-${i}" class="notice" style="display:none">Đáp án: ${esc(q.answer)}. ${esc(q.explanation)}</div></div>`).join('')}</div>`}
function practiceFeedback(btn,correct,answer,i){const n=document.getElementById('pf-'+i);n.style.display='block';n.innerHTML='<b>'+(correct?'Chính xác!':'Chưa đúng, xem lại.')+'</b> '+n.textContent;}
function docs(){return `${heading('Tài liệu tham khảo online','Ưu tiên nguồn đáng tin cậy, kiểm tra điều kiện phản ứng và ghi rõ xuất xứ.') }<div class="cards">${links.map(([name,url])=>`<a class="quick" target="_blank" rel="noreferrer" href="${url}"><div class="ic">▤</div><strong>${esc(name)}</strong><span>Mở tài liệu tham khảo trực tuyến ↗</span></a>`).join('')}</div><div class="panel"><h3>Tra cứu chủ đề Hóa học trên Wikipedia</h3><div class="row"><label class="field">Từ khóa<input id="search" placeholder="Ví dụ: liên kết hóa học"/></label><button class="btn" onclick="window.open('https://vi.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(document.getElementById('search').value),'_blank','noopener,noreferrer')">Tìm kiếm online ↗</button></div><p class="muted">Wikipedia có thể chứa nội dung chưa được kiểm chứng; cần đối chiếu SGK, IUPAC, PubChem.</p></div>`}
function render(){const current=navs.find(x=>x[0]===state.tab)||navs[0];const menu=navs.map(([id,icon,title])=>`<button class="nav ${id===state.tab?'active':''}" onclick="navigate('${id}')"><em>${icon}</em> ${title}</button>`).join('');const views={home,bank,create,test:testView,results,ai,practice,docs};document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="logo"><i>⚛</i><div><b>EduPlan AI</b><small>HÓA HỌC THPT • 5.5</small></div></div><nav class="navig">${menu}</nav><div class="sidefoot"><b>CHẾ ĐỘ XEM THỬ</b><br>Số liệu trên thiết bị, không phải hệ thống online. Không lưu hoặc truyền dữ liệu học sinh thực.</div></aside><main class="page"><header class="top"><div class="breadcrumbs">EduPlan AI 5.5 / <b>${current[2]}</b></div><div class="row" style="margin:0"><span class="demo-pill">DEMO • KHÔNG KẾT NỐI MÁY CHỦ</span><label class="field" style="min-width:120px;margin:0">Vai trò<select onchange="role(this.value)"><option value="teacher" ${state.role==='teacher'?'selected':''}>Giáo viên</option><option value="student" ${state.role==='student'?'selected':''}>Học sinh</option></select></label></div></header><div class="content"><div id="notice" class="notice" style="display:none"></div>${views[state.tab]()}<div class="footer">Tác giả giải pháp: Lê Bá Nhẫn – Trường THPT Hòn Đất · EduPlan AI 5.5 · Chế độ trình diễn độc lập</div></div></main></div>`;if(state.tab==='create')drawMatrix()}
render();persist();
</script></body></html>
